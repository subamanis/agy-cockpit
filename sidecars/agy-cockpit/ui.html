      function openNewConvModal(targetScope) {
        closeProjectContextMenu();
        const ta = document.getElementById('new-chat-textarea');
        if (ta) state.newChatText = ta.value;
        const scopeKey = targetScope || '__unscoped__';
        state.selectedWorkspaceKey = scopeKey;
        state.newChatTargetKey = scopeKey;
        state.newChatGeneral = scopeKey === '__unscoped__';
        state.newChatOpen = true;
        if (sectionOtherEl && sectionOtherEl.classList.contains('collapsed')) {
          sectionOtherEl.classList.remove('collapsed');
        }
        renderAll();
        ensureModelsLoaded(state.lastPinnedId || state.hostConvId, false);
        const nextTa = document.getElementById('new-chat-textarea');
        if (nextTa) {
          nextTa.focus();
        }
      }

      async function handleSetConversationArchived(convId, archived) {
        if (!convId) return;
        state.openMenuConvId = null;
        try {
          if (archived) {
            await evictPinnedConversationIfMatching(convId, 0);
          }
          const res = await apiFetch('/api/conversation-archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversationId: convId, archived: Boolean(archived) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to update conversation');
          }
          await refreshAfterArchiveMutation(!archived);
          showToast(archived ? 'Archived conversation' : 'Restored conversation');
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      function openDeleteConvConfirmModal(convId, convTitle) {
        if (!modalBackdropEl || !convId) return;
        state.activeContextModalConvId = null;
        state.contextModalReqSeq += 1;
        state.openMenuConvId = null;
        renderAll();
        const safeTitle = escapeHtml(convTitle || ('Conversation ' + convId.slice(0, 8)));
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Delete conversation?</div>' +
            '<div class="modal-body">' +
              'Permanently delete <strong>' + safeTitle + '</strong>? This removes the trajectory from Antigravity and cannot be undone.' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Cancel</button>' +
              '<button class="btn-danger" data-action="confirm-delete-conv" data-id="' + escapeHtml(convId) + '">Delete</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      async function handleDeleteConversation(convId, fromArchivedModal = false) {
        if (!convId) return;
        state.openMenuConvId = null;
        try {
          await evictPinnedConversationIfMatching(convId, 120);
          const res = await apiFetch('/api/conversation-delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ conversationId: convId })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to delete conversation');
          }
          state.expandedDetails.delete(convId);
          state.expandedSubagents.delete(convId);
          state.handoffStateByConv.delete(convId);
          const keyPrefix = convId + ':';
          for (const k of [...state.expandedPromptKeys]) {
            if (k.startsWith(keyPrefix)) state.expandedPromptKeys.delete(k);
          }
          for (const k of state.scrollPositions.keys()) {
            if (k === convId || k.startsWith(keyPrefix)) state.scrollPositions.delete(k);
          }
          if (state.openHandoffId === convId) state.openHandoffId = null;
          await refreshAfterArchiveMutation(fromArchivedModal);
          showToast('Deleted conversation');
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      function closeModal() {
        if (!modalBackdropEl) return;
        stopQuotaModalTimer();
        state.activeContextModalConvId = null;
        state.contextModalReqSeq += 1;
        modalBackdropEl.classList.remove('open');
        modalBackdropEl.innerHTML = '';
      }

      function openArchiveConfirmModal(projectId, projectName, wsKey) {
        if (!modalBackdropEl || !projectId) return;
        state.activeContextModalConvId = null;
        state.contextModalReqSeq += 1;
        const safeName = escapeHtml(projectName || 'this project');
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Archive project "' + safeName + '"?</div>' +
            '<div class="modal-body">' +
              'This will temporarily hide <strong>' + safeName + '</strong> and its conversations from both the Antigravity sidebar and AGY Cockpit. Nothing is deleted, and you can unarchive it anytime.' +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Cancel</button>' +
              '<button class="btn-primary" data-action="confirm-archive-project" data-project-id="' + escapeHtml(projectId) + '" data-project-name="' + escapeHtml(projectName || '') + '" data-ws-key="' + escapeHtml(wsKey || '') + '">Archive Project</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      function openArchivedModal() {
        if (!modalBackdropEl) return;
        state.activeContextModalConvId = null;
        state.contextModalReqSeq += 1;
        const projList = Array.isArray(state.archivedProjects) ? state.archivedProjects : [];
        const convList = Array.isArray(state.archivedConversations) ? state.archivedConversations : [];
        if (projList.length === 0 && convList.length === 0) {
          closeModal();
          return;
        }
        let rowsHtml = '';
        for (const c of convList) {
          const title = c.title || c.firstPrompt || c.lastPrompt || ('Conversation ' + c.id.slice(0, 8));
          const sub = [c.workspaceName || 'General', formatRelativeTime(c.lastActiveMs)].filter(Boolean).join(' · ');
          rowsHtml +=
            '<div class="modal-row">' +
              '<div class="modal-row-info">' +
                '<span class="modal-row-name">' + escapeHtml(title) + '</span>' +
                '<span class="modal-row-sub">Chat · ' + escapeHtml(sub) + '</span>' +
              '</div>' +
              '<div style="display:flex;gap:4px;flex-shrink:0;">' +
                '<button class="btn-primary" data-action="confirm-unarchive-conv" data-id="' + escapeHtml(c.id) + '">Restore</button>' +
                '<button class="btn-danger" data-action="confirm-delete-conv" data-from-archived="1" data-id="' + escapeHtml(c.id) + '" title="Delete permanently">Delete</button>' +
              '</div>' +
            '</div>';
        }
        for (const p of projList) {
          const chatLabel = p.count === 1 ? '1 chat' : (p.count + ' chats');
          rowsHtml +=
            '<div class="modal-row">' +
              '<div class="modal-row-info">' +
                '<span class="modal-row-name">' + escapeHtml(p.name) + '</span>' +
                '<span class="modal-row-sub">Project · ' + escapeHtml(chatLabel + (p.path ? ' · ' + p.path : '')) + '</span>' +
              '</div>' +
              '<button class="btn-primary" data-action="confirm-unarchive-project" data-project-id="' + escapeHtml(p.id) + '" data-project-name="' + escapeHtml(p.name) + '">Unarchive</button>' +
            '</div>';
        }
        modalBackdropEl.innerHTML =
          '<div class="modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Archived (' + (projList.length + convList.length) + ')</div>' +
            '<div class="modal-body">Restore or manage archived conversations and projects:</div>' +
            '<div class="modal-list">' + rowsHtml + '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Close</button>' +
            '</div>' +
          '</div>';
        modalBackdropEl.classList.add('open');
      }

      async function handleSetProjectArchived(projectId, projectName, archived, wsKey) {
        if (!projectId) return;
        try {
          if (archived) {
            await evictPinnedConversationIfMatching(
              (c) => c.projectId === projectId || Boolean(wsKey && c.workspaceKey === wsKey),
              0
            );
          }
          const res = await apiFetch('/api/project-archive', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId, archived: Boolean(archived) })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to update project');
          }
          if (archived && wsKey && state.selectedWorkspaceKey === wsKey) {
            state.selectedWorkspaceKey = '__auto__';
          }
          await refreshAfterArchiveMutation(!archived);
          showToast((archived ? 'Archived ' : 'Unarchived ') + (projectName || 'project'));
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      document.addEventListener('contextmenu', (e) => {
        const wsBtn = e.target.closest('.scope-tab[data-ws]');
        if (wsBtn) {
          const wsKey = wsBtn.getAttribute('data-ws') || '';
          if (wsKey && wsKey !== '__all__') {
            e.preventDefault();
            const projId = wsBtn.getAttribute('data-project-id') || '';
            const wsName = wsBtn.getAttribute('data-ws-name') || wsBtn.getAttribute('data-project-name') || '';
            openProjectContextMenu(e.clientX, e.clientY, wsKey, wsName, projId);
            return;
          }
        }
        const archBtn = e.target.closest('[data-action="open-archived-modal"]');
        if (archBtn) {
          e.preventDefault();
          closeProjectContextMenu();
          openArchivedModal();
        }
      });

      const CARD_NON_CHAT_ZONE_SELECTOR =
        '.card-handoff-slot, .card-details-slot, .card-menu-wrap, .subagents-list';
      let pointerDownTarget = null;
      let pointerDownInCardSubzone = false;

      document.addEventListener('click', async (e) => {
        let clickTarget = e.target;
        if (pointerDownTarget && !pointerDownTarget.isConnected && typeof e.clientX === 'number') {
          const downActionEl = pointerDownTarget.closest ? pointerDownTarget.closest('[data-action]') : null;
          const pointEl = document.elementFromPoint(e.clientX, e.clientY);
          const upActionEl = pointEl && pointEl.closest ? pointEl.closest('[data-action]') : null;
          if (
            downActionEl &&
            upActionEl &&
            downActionEl.getAttribute('data-action') === upActionEl.getAttribute('data-action') &&
            downActionEl.getAttribute('data-id') === upActionEl.getAttribute('data-id')
          ) {
            clickTarget = upActionEl;
          }
        }
        const inCardSubzone =
          pointerDownInCardSubzone ||
          Boolean(clickTarget && clickTarget.closest && clickTarget.closest(CARD_NON_CHAT_ZONE_SELECTOR));
        pointerDownTarget = null;
        pointerDownInCardSubzone = false;

        if (ctxMenuEl && ctxMenuEl.style.display !== 'none' && !clickTarget.closest('#ctx-menu')) {
          closeProjectContextMenu();
        }

        if (modalBackdropEl && e.target === modalBackdropEl) {
          closeModal();
          return;
        }

        const wsBtn = clickTarget.closest('[data-ws]');
        const actionBtn = clickTarget.closest('[data-action]');

        if (state.openMenuConvId && !clickTarget.closest('.card-menu-wrap')) {
          state.openMenuConvId = null;
          renderAll();
        }

        if (wsBtn) {
          const nextWs = wsBtn.getAttribute('data-ws');
          state.selectedWorkspaceKey = nextWs;
          if (state.newChatOpen) {
            if (nextWs === '__unscoped__') {
              state.newChatTargetKey = '__unscoped__';
              state.newChatGeneral = true;
            } else if (nextWs && nextWs !== '__all__') {
              state.newChatTargetKey = nextWs;
              state.newChatGeneral = false;
            }
          }
          const pinnedId = state.lastPinnedId || state.hostConvId;
          const pinnedCard = pinnedId
            ? state.conversations.find((c) => c.id === pinnedId)
            : null;
          if (
            pinnedCard &&
            pinnedCard.unread &&
            !pinnedCard.isThinking &&
            !pinnedCard.waitState &&
            (nextWs === '__all__' || nextWs === (pinnedCard.workspaceKey || '__unscoped__'))
          ) {
            markConversationSeenInServer(pinnedCard.id);
          }
          renderAll();
          return;
        }

        if (!actionBtn) return;
        if (
          inCardSubzone &&
          (actionBtn.classList.contains('conv-row') || actionBtn.classList.contains('conv-row-header'))
        ) {
          return;
        }
        const action = actionBtn.getAttribute('data-action');
        const convId = actionBtn.getAttribute('data-id');

        if (action === 'ctx-new-chat') {
          const wsKey = actionBtn.getAttribute('data-ws-key') || '__unscoped__';
          openNewConvModal(wsKey);
          return;
        }
        if (action === 'ctx-archive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          const wsKey = actionBtn.getAttribute('data-ws-key') || '';
          closeProjectContextMenu();
          openArchiveConfirmModal(projId, projName, wsKey);
          return;
        }
        if (action === 'close-modal') {
          closeModal();
          return;
        }
        if (action === 'diag-toggle') {
          state.diagExpanded = !state.diagExpanded;
          renderDiagnosticsSticky();
          return;
        }
        if (action === 'diag-recheck') {
          handleRecheckDiagnostics();
          return;
        }
        if (action === 'diag-copy') {
          handleCopyDiagnosticsFixPrompt();
          return;
        }
        if (action === 'diag-dismiss') {
          const sig = (state.diagnostics && state.diagnostics.signature) || '';
          if (sig) {
            state.dismissedDiagSig = sig;
            state.diagExpanded = false;
            try {
              sessionStorage.setItem('__agy_cockpit_dismissed_diag_sig__', sig);
            } catch {}
            renderDiagnosticsSticky();
          }
          return;
        }
        if (action === 'open-archived-modal') {
          openArchivedModal();
          return;
        }
        if (action === 'open-quota-modal') {
          openQuotaModal();
          return;
        }
        if (action === 'open-context-modal' && convId) {
          openContextBreakdownModal(convId);
          return;
        }
        if (action === 'confirm-archive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          const wsKey = actionBtn.getAttribute('data-ws-key') || '';
          handleSetProjectArchived(projId, projName, true, wsKey);
          return;
        }
        if (action === 'confirm-unarchive-project') {
          const projId = actionBtn.getAttribute('data-project-id');
          const projName = actionBtn.getAttribute('data-project-name') || '';
          handleSetProjectArchived(projId, projName, false, '');
          return;
        }
        if (action === 'toggle-card-menu' && convId) {
          closeProjectContextMenu();
          state.openMenuConvId = state.openMenuConvId === convId ? null : convId;
          renderAll();
          return;
        }
        if (action === 'toggle-unread-conv' && convId) {
          const nextUnread = actionBtn.getAttribute('data-unread') !== '1';
          handleSetConversationUnread(convId, nextUnread);
          return;
        }
        if (action === 'toggle-pin-conv' && convId) {
          const nextPinned = actionBtn.getAttribute('data-pinned') !== '1';
          handlePinConversation(convId, nextPinned);
          return;
        }
        if (action === 'prompt-rename-conv' && convId) {
          const cTitle = actionBtn.getAttribute('data-title') || '';
          const dTitle = actionBtn.getAttribute('data-default-title') || '';
          openRenameConvModal(convId, cTitle, dTitle);
          return;
        }
        if (action === 'copy-conv-id' && convId) {
          state.openMenuConvId = null;
          renderAll();
          await copyTextToClipboard(convId);
          showToast('Copied conversation ID');
          return;
        }
        if (action === 'reset-rename-conv' && convId) {
          handleRenameConversation(convId, '');
          return;
        }
        if (action === 'confirm-rename-conv' && convId) {
          const inputEl = document.getElementById('rename-conv-input');
          const nextTitle = inputEl ? inputEl.value : '';
          handleRenameConversation(convId, nextTitle);
          return;
        }
        if (action === 'archive-conv' && convId) {
          handleSetConversationArchived(convId, true);
          return;
        }
        if (action === 'confirm-unarchive-conv' && convId) {
          handleSetConversationArchived(convId, false);
          return;
        }
        if (action === 'prompt-delete-conv' && convId) {
          const cTitle = actionBtn.getAttribute('data-title') || '';
          openDeleteConvConfirmModal(convId, cTitle);
          return;
        }
        if (action === 'confirm-delete-conv' && convId) {
          const fromArchived = actionBtn.getAttribute('data-from-archived') === '1';
          handleDeleteConversation(convId, fromArchived);
          return;
        }
        if (action === 'toggle-new-chat') {
          const ta = document.getElementById('new-chat-textarea');
          if (ta) state.newChatText = ta.value;
          state.newChatOpen = !state.newChatOpen;
          if (!state.newChatOpen) {
            state.newChatTargetKey = '';
            state.newChatModelEnum = '';
            state.newChatGeneral = false;
          } else {
            const pinnedCard = state.conversations.find((c) => c.id === state.lastPinnedId) || null;
            const effectiveScope = resolveEffectiveWorkspaceScope(pinnedCard);
            if (effectiveScope === '__unscoped__') {
              state.newChatTargetKey = '__unscoped__';
              state.newChatGeneral = true;
            } else if (effectiveScope && effectiveScope !== '__all__') {
              state.newChatTargetKey = effectiveScope;
              state.newChatGeneral = false;
            } else {
              state.newChatTargetKey = '';
              state.newChatGeneral = false;
            }
          }
          if (state.newChatOpen && sectionOtherEl && sectionOtherEl.classList.contains('collapsed')) {
            sectionOtherEl.classList.remove('collapsed');
          }
          renderAll();
          if (state.newChatOpen) {
            ensureModelsLoaded(state.lastPinnedId || state.hostConvId, false);
            const nextTa = document.getElementById('new-chat-textarea');
            if (nextTa) nextTa.focus();
          }
          return;
        }
        if (action === 'submit-new-chat') {
          handleStartQuickNewChat();
          return;
        }

        if (action === 'toggle-section') {
          const sec = actionBtn.getAttribute('data-section');
          if (sec === 'other' && sectionOtherEl) {
            const isCollapsed = sectionOtherEl.classList.toggle('collapsed');
            if (!isCollapsed) {
              renderAll();
            }
          }
          return;
        }

        if (action === 'open-chat' && convId) {
          markConversationSeenInServer(convId);
          const curId = state.lastPinnedId || state.hostConvId;
          if (convId !== curId) {
            state.selectedWorkspaceKey = '__auto__';
            clearSearchState();
          }
          if (!initialHostConvId) {
            const targetCard = state.conversations.find((c) => c.id === convId);
            state.hostConvId = convId;
            state.manualPinId = convId;
            state.manualPinTs = Math.max(getCardFocusMs(targetCard), Date.now());
          }
          renderAll();
          claimActiveConversation(convId);
          openConversationInHost(convId);
        } else if (action === 'toggle-subagents' && convId) {
          if (state.expandedSubagents.has(convId)) state.expandedSubagents.delete(convId);
          else state.expandedSubagents.add(convId);
          renderAll();
        } else if (action === 'open-subagent' && convId) {
          openConversationInHost(convId);
        } else if (action === 'toggle-details' && convId) {
          toggleDetails(convId);
        } else if (action === 'toggle-handoff' && convId) {
          const onPinnedCard = Boolean(actionBtn.closest('#pinned-container'));
          const currentTargetId = onPinnedCard && state.lastPinnedId ? state.lastPinnedId : convId;
          if (state.openHandoffId && (!state.pendingSmartHandoff || state.pendingSmartHandoff.convId !== state.openHandoffId)) {
            readCurrentHandoffText(state.openHandoffId);
          }
          if (state.openHandoffId === currentTargetId) {
            state.openHandoffId = null;
            renderAll();
          } else {
            if (onPinnedCard && (Date.now() - state.lastPollDoneMs) > 250) {
              await fetchStatus(false);
            }
            const targetConvId = onPinnedCard && state.lastPinnedId ? state.lastPinnedId : convId;
            const targetConv = state.conversations.find((c) => c.id === targetConvId);
            if (targetConv) {
              syncConversationHandoffState(targetConv);
            }
            state.openHandoffId = targetConvId;
            renderAll();
            ensureModelsLoaded(targetConvId, false);
          }
        } else if (action === 'cancel-pending-handoff') {
          cancelPendingSmartHandoff(true);
        } else if (action === 'handoff-smart-run' && convId) {
          handleSmartHandoffRun(convId);
        } else if (action === 'handoff-start-chat' && convId) {
          handleStartNewChatFromHandoff(convId);
        } else if (action === 'handoff-copy' && convId) {
          handleCopyHandoffText(convId);
        } else if (action === 'toggle-clamp') {
          const el = actionBtn.previousElementSibling;
          if (el) {
            const expanded = el.classList.toggle('expanded');
            actionBtn.textContent = expanded ? 'Show less' : 'Show more';
            const expandKey = actionBtn.getAttribute('data-expand-key');
            if (expandKey) {
              if (expanded) state.expandedPromptKeys.add(expandKey);
              else state.expandedPromptKeys.delete(expandKey);
            }
          }
        }
      });

      document.addEventListener('change', (e) => {
        const target = e.target;
        if (!target || !target.classList) return;
        if (target.id === 'new-chat-project-select') {
          const ta = document.getElementById('new-chat-textarea');
          if (ta) state.newChatText = ta.value;
          const nextKey = target.value || '__unscoped__';
          state.newChatTargetKey = nextKey;
          state.newChatGeneral = nextKey === '__unscoped__';
          renderAll();
          const nextTa = document.getElementById('new-chat-textarea');
          if (nextTa) nextTa.focus();
          return;
        }
        const convId = target.getAttribute('data-conv-id');
        if (!convId) return;
        const isNewChat = convId === '__new_chat__';
        const card = isNewChat
          ? (state.conversations.find((c) => c.id === state.lastPinnedId) || null)
          : state.conversations.find((c) => c.id === convId);
        const hState = isNewChat ? null : getHandoffState(convId);

        if (target.classList.contains('handoff-family-select')) {
          const chosenFamily = target.value;
          const groups = groupModelsByFamily(card);
          const grp = groups.find((g) => g.family === chosenFamily);
          if (grp && grp.models.length > 0) {
            const prevSelected = isNewChat
              ? resolveSelectedModelEntry(card, state.newChatModelEnum)
              : resolveSelectedModelEntry(card);
            const prevTier = (prevSelected && prevSelected.tier) ? prevSelected.tier.toLowerCase() : '';
            const sameTier = prevTier
              ? grp.models.find((m) => (m.tier || '').toLowerCase() === prevTier)
              : null;
            const nextModel = sameTier || grp.models[0];
            if (isNewChat) {
              state.newChatModelEnum = nextModel.modelEnum;
            } else if (hState) {
              hState.selectedModelEnum = nextModel.modelEnum;
            }
            renderAll();
          }
        } else if (target.classList.contains('handoff-tier-select')) {
          if (isNewChat) {
            state.newChatModelEnum = target.value;
          } else if (hState) {
            hState.selectedModelEnum = target.value;
          }
          renderAll();
        }
      });

      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'new-chat-textarea') {
          state.newChatText = e.target.value;
          return;
        }
        if (e.target && e.target.hasAttribute('data-focus-conv')) {
          const convId = e.target.getAttribute('data-focus-conv');
          if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
            return;
          }
          const hState = getHandoffState(convId);
          hState.text = e.target.value;
          if (hState.step === 'ready' && e.target.value.trim() === '') {
            const card = state.conversations.find((c) => c.id === convId);
            hState.step = 'focus';
            hState.text = '';
            hState.dismissedHandoffMs = Math.max(
              hState.dismissedHandoffMs || 0,
              hState.loadedHandoffMs || 0,
              (card && Number(card.latestHandoffMs)) || 0
            );
            state.scrollPositions.set(convId + ':handoff', 0);
            renderAll();
            const nextTa = document.querySelector('textarea.handoff-input[data-focus-conv="' + convId + '"]');
            if (nextTa) {
              nextTa.focus();
            }
          }
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && ctxMenuEl && ctxMenuEl.style.display !== 'none') {
          e.preventDefault();
          closeProjectContextMenu();
          return;
        }
        if (e.key === 'Escape' && modalBackdropEl && modalBackdropEl.classList.contains('open')) {
          e.preventDefault();
          closeModal();
          return;
        }
        if (e.target && e.target.id === 'rename-conv-input') {
          if (e.key === 'Enter') {
            e.preventDefault();
            const convId = e.target.getAttribute('data-id');
            if (convId) {
              handleRenameConversation(convId, e.target.value);
            }
          }
          return;
        }
        if (e.target && e.target.id === 'new-chat-textarea') {
          if (e.key === 'Escape') {
            e.preventDefault();
            state.newChatOpen = false;
            state.newChatTargetKey = '';
            state.newChatModelEnum = '';
            renderAll();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            handleStartQuickNewChat();
          }
          return;
        }
        if (e.target && e.target.classList && e.target.classList.contains('handoff-input')) {
          const convId = e.target.getAttribute('data-focus-conv');
          if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
            e.preventDefault();
            return;
          }
          if (e.key === 'Escape') {
            e.preventDefault();
            state.openHandoffId = null;
            renderAll();
          } else if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            e.preventDefault();
            if (convId) {
              const hState = getHandoffState(convId);
              if (hState.step === 'ready') {
                handleStartNewChatFromHandoff(convId);
              } else {
                handleSmartHandoffRun(convId);
              }
            }
          }
        }
      });

      let searchTimer = null;
      searchInput.addEventListener('input', () => {
        state.searchQuery = searchInput.value;
        clearTimeout(searchTimer);
        if (!state.searchQuery.trim()) {
          state.lastFetchedQuery = '';
          state.searchMatches = null;
          renderAll();
          return;
        }
        searchTimer = setTimeout(() => {
          fetchStatus(false);
        }, 120);
      });

      function updateWorkspaceUris(uris) {
        const nextUris = Array.isArray(uris) ? uris : [];
        const nextJson = JSON.stringify(nextUris);
        if (nextJson === state.lastWorkspaceUrisJson) return false;
        state.workspaceUris = nextUris;
        state.lastWorkspaceUrisJson = nextJson;
        state.version = 0;
        return true;
      }

      btnUpdate.addEventListener('click', async () => {
        if (state.pluginUpdating) return;
        state.pluginUpdating = true;
        renderPluginUpdateButton();
        let reloading = false;
        try {
          const res = await apiFetch('/api/plugin-update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          });
          const data = await res.json().catch(() => ({}));
          if (data && data.pluginUpdate) state.pluginUpdate = data.pluginUpdate;
          if (res.ok && data && data.updated) {
            reloading = true;
            showToast('Updated to ' + (data.installedShort || 'latest') + ', reloading...');
            if (!data.serverRestarting) {
              window.location.reload();
              return;
            }
            let ready = false;
            for (let attempt = 0; attempt < 20; attempt++) {
              await new Promise((r) => setTimeout(r, 200));
              try {
                const probe = await apiFetch('/api/status', { signal: AbortSignal.timeout(800) });
                if (probe.ok) {
                  ready = true;
                  break;
                }
              } catch {}
            }
            if (ready) {
              window.location.reload();
              return;
            }
            reloading = false;
            return;
          }
          await fetchStatus(true);
          if (res.ok && data && data.upToDate) {
            const verSuffix = data.installedShort ? ' (' + data.installedShort + ')' : '';
            showToast('Already on latest version' + verSuffix);
          } else if (res.ok && data && data.blockedByDirty) {
            showToast('Update ' + (data.remoteShort || '') + ' skipped (uncommitted changes in local repo)');
          } else {
            showToast('Update check failed: ' + ((data && data.error) || ('HTTP ' + res.status)));
          }
        } catch (err) {
          showToast('Update check failed: ' + (err && err.message ? err.message : 'network error'));
        } finally {
          if (!reloading) {
            state.pluginUpdating = false;
            renderPluginUpdateButton();
          }
        }
      });

      // Unread / "is the user looking at this chat" model. Every fact below was verified with a live
      // trace; re-read this before touching claims, markConversationSeenInServer or viewedConvId.
      //
      // 1. The aux pane keeps one Cockpit iframe alive per opened chat. Off-screen iframes keep polling,
      //    report document.hidden === false with a non-zero size, and document.hasFocus() is false in
      //    every iframe while the user types in the chat panel. Visibility APIs therefore cannot tell
      //    which iframe is on screen; the shared localStorage claim (ACTIVE_CONV_STORAGE_KEY) is the only
      //    signal, and only the claim holder may auto-mark its chat as seen (justCompletedReply in
      //    renderAll, viewedConvId in fetchStatus). Any new auto-seen path must be gated on the claim,
      //    otherwise a hidden iframe silently clears the blue dot of the chat it belongs to.
      // 2. On a chat switch Antigravity writes the SAME last_user_view_time into BOTH .pbtxt files (the
      //    left and the entered chat), and it bumps it again while the user interacts with the open chat.
      //    lastViewMs means "the user was around this chat at T", never "this chat is open now", and
      //    max(lastViewMs) is a tie right after every switch. Claiming from lastViewMs alone made the
      //    hidden iframe of the left chat steal the claim back, so its reply was marked seen and no dot
      //    appeared (race: it only worked when the pointer happened to cross the new Cockpit iframe).
      // 3. A Cockpit click claims the target explicitly BEFORE toggleConversation; the Antigravity stamp
      //    lands ~60 ms later. A native switch (sidebar) claims nothing, so its stamp is newer than the
      //    claim by far more than CLAIM_SWITCH_GRACE_MS. That ordering is what maybeTakeOverActiveClaim
      //    relies on. Pointer events can only reach the on-screen iframe, so they may claim freely.
      // 4. Aux pane iframes must not claim on boot: a plugin update reloads every live iframe at once and
      //    the last one to finish booting would win.
      const ACTIVE_CONV_STORAGE_KEY = '__agy_cockpit_active_conv_id__';
      const ACTIVE_CONV_TS_STORAGE_KEY = '__agy_cockpit_active_conv_ts__';

      function isIframeCollapsed() {
        return Boolean(window.innerWidth === 0 && window.innerHeight === 0);
      }

      function isIframeHidden() {
        return Boolean(document.hidden || isIframeCollapsed());
      }

      function clearSearchState() {
        clearTimeout(searchTimer);
        const hadSearch = Boolean(state.searchQuery || (searchInput && searchInput.value) || state.searchMatches);
        state.searchQuery = '';
        state.lastFetchedQuery = '';
        state.searchMatches = null;
        if (searchInput && searchInput.value) {
          searchInput.value = '';
        }
        return hadSearch;
      }

      function resetTransientScopeAndDrawers() {
        closeProjectContextMenu();
        let needRender = clearSearchState();
        if (state.selectedWorkspaceKey !== '__auto__') {
          state.selectedWorkspaceKey = '__auto__';
          needRender = true;
        }
        if (state.openHandoffId && !state.pendingSmartHandoff) {
          state.openHandoffId = null;
          needRender = true;
        }
        if (state.openMenuConvId) {
          state.openMenuConvId = null;
          needRender = true;
        }
        if (state.expandedDetails.size > 0) {
          state.expandedDetails.clear();
          needRender = true;
        }
        if (state.expandedSubagents.size > 0) {
          state.expandedSubagents.clear();
          needRender = true;
        }
        if (state.newChatOpen && !state.newChatSending) {
          state.newChatOpen = false;
          state.newChatTargetKey = '';
          state.newChatModelEnum = '';
          state.newChatGeneral = false;
          needRender = true;
        }
        if (needRender) {
          renderAll();
        }
      }

      function isThisIframeActiveConv() {
        if (isIframeHidden()) return false;
        const myId = (state.lastPinnedId || state.hostConvId || '').trim().toLowerCase();
        if (!myId) return false;
        const myCard = state.conversations.find((c) => c.id === myId);
        if (myCard) {
          const effectiveScope = resolveEffectiveWorkspaceScope(myCard);
          const myWsKey = myCard.workspaceKey || '__unscoped__';
          if (effectiveScope !== '__all__' && effectiveScope !== myWsKey) {
            return false;
          }
        }
        if (document.hasFocus()) return true;
        let claimedId = '';
        try {
          claimedId = (localStorage.getItem(ACTIVE_CONV_STORAGE_KEY) || '').trim().toLowerCase();
        } catch {}
        return !claimedId || claimedId === myId;
      }

      function readActiveClaim() {
        try {
          return {
            id: (localStorage.getItem(ACTIVE_CONV_STORAGE_KEY) || '').trim().toLowerCase(),
            ts: Number(localStorage.getItem(ACTIVE_CONV_TS_STORAGE_KEY)) || 0
          };
        } catch {
          return { id: '', ts: 0 };
        }
      }

      // A Cockpit click claims the target before the switch, therefore only a view stamp clearly newer
      // than the current claim (a native switch) or a new prompt typed in this chat moves the claim here.
      // See the unread model notes above ACTIVE_CONV_STORAGE_KEY.
      const CLAIM_SWITCH_GRACE_MS = 2000;
      function maybeTakeOverActiveClaim() {
        if (!initialHostConvId || isIframeHidden()) return;
        const myCard = state.conversations.find((c) => c.id === initialHostConvId);
        if (!myCard) return;
        const claim = readActiveClaim();
        if (claim.id === initialHostConvId) return;
        const myViewMs = Number(myCard.lastViewMs) || 0;
        let enteredHere = myViewMs > claim.ts + CLAIM_SWITCH_GRACE_MS;
        if (enteredHere) {
          for (const c of state.conversations) {
            if (!c.isSubagent && c.id !== myCard.id && (Number(c.lastViewMs) || 0) > myViewMs) {
              enteredHere = false;
              break;
            }
          }
        }
        if (enteredHere || (Number(myCard.lastUserInputMs) || 0) > claim.ts) {
          claimActiveConversation(initialHostConvId);
        }
      }

      function claimActiveConversation(explicitConvId) {
        if (!explicitConvId && isIframeHidden()) return;
        const activeId = (explicitConvId || state.lastPinnedId || state.hostConvId || '').trim().toLowerCase();
        if (!activeId) return;
        try {
          const changed = localStorage.getItem(ACTIVE_CONV_STORAGE_KEY) !== activeId;
          if (changed) {
            uiTrace('claim', { id: activeId.slice(0, 8), explicit: Boolean(explicitConvId), caller: (new Error().stack || '').split('\n')[2] || '' });
            localStorage.setItem(ACTIVE_CONV_STORAGE_KEY, activeId);
          }
          if (changed || explicitConvId) {
            localStorage.setItem(ACTIVE_CONV_TS_STORAGE_KEY, String(Date.now()));
          }
        } catch {}
      }

      window.addEventListener('storage', (ev) => {
        if (!ev || ev.key !== ACTIVE_CONV_STORAGE_KEY) return;
        if (document.hasFocus()) return;
        const newActiveId = (ev.newValue || '').trim().toLowerCase();
        const myId = (state.lastPinnedId || state.hostConvId || '').trim().toLowerCase();
        if (newActiveId && myId && newActiveId !== myId) {
          resetTransientScopeAndDrawers();
        }
      });

      let wasIframeCollapsed = isIframeCollapsed();

      function syncIframeVisibility() {
        const nowCollapsed = isIframeCollapsed();
        if (!wasIframeCollapsed && nowCollapsed) {
          wasIframeCollapsed = true;
          resetTransientScopeAndDrawers();
          return;
        }
        if (wasIframeCollapsed && !nowCollapsed) {
          wasIframeCollapsed = false;
          if (state.selectedWorkspaceKey !== '__auto__') {
            state.selectedWorkspaceKey = '__auto__';
            renderAll();
          }
          claimActiveConversation();
          fetchStatus(false);
        }
      }

      window.addEventListener('resize', () => {
        syncIframeVisibility();
      });

      if (window.sidecar && typeof window.sidecar.onWorkspaceChange === 'function') {
        window.sidecar.onWorkspaceChange((uris) => {
          if (updateWorkspaceUris(uris) || (Date.now() - state.lastPollDoneMs) > 300) {
            fetchStatus(false);
          }
        });
      }

      document.addEventListener('visibilitychange', () => {
        syncIframeVisibility();
        if (!isIframeHidden()) {
          fetchStatus(false);
        }
      });

      window.addEventListener('focus', () => {
        syncIframeVisibility();
        if (!isIframeHidden()) {
          claimActiveConversation();
          fetchStatus(false);
        }
      });

      document.addEventListener('pointerdown', (e) => {
        pointerDownTarget = e.target || null;
        pointerDownInCardSubzone = Boolean(
          e.target && e.target.closest && e.target.closest(CARD_NON_CHAT_ZONE_SELECTOR)
        );
        if (!isIframeHidden()) {
          claimActiveConversation();
        }
      });

      let lastPointerClaimMs = 0;
      document.addEventListener('pointermove', () => {
        const now = Date.now();
        if (now - lastPointerClaimMs < 1200) return;
        lastPointerClaimMs = now;
        if (!isIframeHidden()) {
          claimActiveConversation();
        }
      });

      document.addEventListener('pointerenter', () => {
        syncIframeVisibility();
        if (!isIframeHidden()) {
          claimActiveConversation();
          if ((Date.now() - state.lastPollDoneMs) > 400) {
            fetchStatus(false);
          }
        }
      });

      (async () => {
        if (window.sidecar && typeof window.sidecar.getWorkspaceUris === 'function') {
          try {
            const uris = await window.sidecar.getWorkspaceUris();
            if (Array.isArray(uris) && uris.length > 0) {
              updateWorkspaceUris(uris);
            }
          } catch {}
        }
        await fetchStatus(true);
        if (!isIframeHidden() && !initialHostConvId) {
          claimActiveConversation(state.lastPinnedId || state.hostConvId);
        }
        void ensureModelsLoaded(state.hostConvId, false);
      })();

      setInterval(() => {
        syncIframeVisibility();
        if (!isIframeHidden() || Boolean(state.pendingSmartHandoff)) {
          fetchStatus(false);
        }
      }, 1500);
    })();
  </script>
</body>
</html>
