              '<span class="muted">· ' + card.promptCount + ' prompt' + (card.promptCount === 1 ? '' : 's') + '</span>' +
            '</div>' +
            gitStatusHtml +
          '</div>' +

          '<div class="meter-group" data-action="open-context-modal" data-id="' + escapeHtml(card.id) + '" title="Click to inspect context window breakdown">' +
            '<div class="meter-head">' +
              '<span class="muted">Context window</span>' +
              '<span class="mono context-meter-val">' + escapeHtml(rightLabel) + '</span>' +
            '</div>' +
            '<div class="meter-track">' +
              '<div class="meter-fill" style="width:' + fillPct + '%;background:' + barColor + ';"></div>' +
            '</div>' +
            '<div class="meter-foot">' +
              '<span>' + escapeHtml(lastCompactLabel) + '</span>' +
              '<span>' + escapeHtml(retentionLabel) + '</span>' +
            '</div>' +
            '<div class="tokens-summary" title="' + escapeHtml(exactTooltip) + '">' +
              '<div class="meter-head">' +
                '<span class="muted">Total tokens used</span>' +
                '<span class="mono tokens-total-wrap">' +
                  '<span>' + escapeHtml(formatTokens(totalTok) + ' tok') + '</span>' +
                  renderSubagentPill(card, true) +
                '</span>' +
              '</div>' +
              '<div class="meter-foot">' +
                '<span>' + escapeHtml(breakdownLabel) + '</span>' +
              '</div>' +
            '</div>' +
            renderSubagentsList(card) +
          '</div>' +

          '<div class="actions-bar">' +
            '<div class="actions-left">' +
              '<button class="btn-solid" data-action="toggle-handoff" data-id="' + escapeHtml(card.id) + '">' +
                (isHandoffOpen ? 'Hide Handoff' : 'Smart Handoff') +
              '</button>' +
            '</div>' +
            '<div class="conv-actions">' +
              '<button class="ghost-btn" data-action="toggle-details" data-id="' + escapeHtml(card.id) + '">' +
                (isDetailsOpen ? 'Hide History' : 'History &amp; Commits') +
              '</button>' +
              renderCardGearMenu(card) +
            '</div>' +
          '</div>'
        );
      }

      function renderCardGearMenu(card, isOtherChat) {
        const idEsc = escapeHtml(card.id);
        const displayTitle = card.customTitle || card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));
        const defaultTitle = card.defaultTitle || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));
        const titleEsc = escapeHtml(displayTitle);
        const defaultTitleEsc = escapeHtml(defaultTitle);
        const isPinned = Boolean(card.pinned);
        const isUnread = Boolean(card.unread);
        const canToggleUnread = Boolean(isOtherChat && !card.isThinking && !card.waitState);
        const isMenuOpen = state.openMenuConvId === card.id;
        return (
          '<div class="card-menu-wrap">' +
            '<button class="ghost-btn gear-btn" data-action="toggle-card-menu" data-id="' + idEsc + '" title="Conversation actions" aria-label="Conversation actions">⚙</button>' +
            (isMenuOpen
              ? '<div class="card-menu">' +
                  (canToggleUnread
                    ? '<button class="card-menu-item" data-action="toggle-unread-conv" data-id="' + idEsc + '" data-unread="' + (isUnread ? '1' : '0') + '">' +
                        (isUnread ? 'Mark as read' : 'Mark as unread') +
                      '</button>'
                    : '') +
                  '<button class="card-menu-item" data-action="toggle-pin-conv" data-id="' + idEsc + '" data-pinned="' + (isPinned ? '1' : '0') + '">' +
                    (isPinned ? 'Unpin from top' : 'Pin to top') +
                  '</button>' +
                  '<button class="card-menu-item" data-action="prompt-rename-conv" data-id="' + idEsc + '" data-title="' + titleEsc + '" data-default-title="' + defaultTitleEsc + '">Rename...</button>' +
                  '<button class="card-menu-item" data-action="copy-conv-id" data-id="' + idEsc + '">Copy ID</button>' +
                  '<div class="ctx-menu-sep"></div>' +
                  '<button class="card-menu-item" data-action="archive-conv" data-id="' + idEsc + '">Archive</button>' +
                  '<button class="card-menu-item danger" data-action="prompt-delete-conv" data-id="' + idEsc + '" data-title="' + titleEsc + '">Delete</button>' +
                '</div>'
              : '') +
          '</div>'
        );
      }

      function renderCompactRowHeader(card, showWorkspaceName) {
        const tier = getCardTier(card);
        const titleText = card.customTitle || card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));
        const pinIconHtml = card.pinned ? PIN_ICON_SVG : '';
        const userMsgText = (card.lastPrompt || card.firstPrompt || '').trim();
        const aiMsgText = (card.lastModelResponse || '').trim();

        let previewsHtml = '';
        const showUserLine = Boolean(userMsgText);
        const showAiLine = Boolean(card.isThinking || card.waitState || aiMsgText);
        if (showUserLine || showAiLine) {
          previewsHtml += '<div class="conv-previews" data-action="open-chat" data-id="' + escapeHtml(card.id) + '">';
          if (showUserLine) {
            previewsHtml +=
              '<div class="conv-msg-line" title="' + escapeHtml(userMsgText) + '">' +
                '<span class="conv-msg-role">You:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(userMsgText) + '</span>' +
              '</div>';
          }
          if (card.waitState) {
            const waitFallback = card.waitState === 'question'
              ? 'Waiting for your answer...'
              : 'Waiting for permission...';
            const waitText = aiMsgText || waitFallback;
            previewsHtml +=
              '<div class="conv-msg-line conv-msg-ai waiting" title="' + escapeHtml(waitText) + '">' +
                '<span class="conv-msg-role">AI:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(waitText) + '</span>' +
              '</div>';
          } else if (card.isThinking) {
            previewsHtml +=
              '<div class="conv-msg-line conv-msg-ai thinking" title="' + escapeHtml(aiMsgText || 'Agent is thinking...') + '">' +
                '<span class="conv-msg-role">AI:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(aiMsgText || 'Thinking...') + '</span>' +
              '</div>';
          } else if (aiMsgText) {
            previewsHtml +=
              '<div class="conv-msg-line conv-msg-ai' + (card.unread ? ' unread' : '') + '" title="' + escapeHtml(aiMsgText) + '">' +
                '<span class="conv-msg-role">AI:</span>' +
                '<span class="conv-msg-text">' + escapeHtml(aiMsgText) + '</span>' +
              '</div>';
          }
          previewsHtml += '</div>';
        }

        const compactedNote = card.compactedPrompts > 0
          ? ' (' + card.compactedPrompts + ' compacted)'
          : '';

        let gitNoteHtml = '';
        if (card.git && card.git.hasGit) {
          gitNoteHtml = card.git.commitsBehind > 0
            ? '<span class="drift-warn">· ' + card.git.commitsBehind + ' behind</span>'
            : '<span>· HEAD</span>';
        }

        const wsNoteHtml = showWorkspaceName && card.workspaceName
          ? '<span>· ' + escapeHtml(card.workspaceName) + '</span>'
          : '';

        const activeSearchQ = (state.lastFetchedQuery || '').trim();
        const searchHit = activeSearchQ && state.searchMatches && state.searchMatches[card.id];
        let searchHitsHtml = '';
        if (searchHit && Array.isArray(searchHit.matchingPrompts) && searchHit.matchingPrompts.length > 0) {
          searchHitsHtml = '<div class="search-hits">';
          for (const mp of searchHit.matchingPrompts) {
            const hitLabel = mp.label || ('#' + mp.index);
            searchHitsHtml += '<div><strong>' + escapeHtml(hitLabel) + ':</strong> ' + highlightSearchText(mp.text, activeSearchQ) + '</div>';
          }
          searchHitsHtml += '</div>';
        }

        const isHandoffOpen = state.openHandoffId === card.id;
        const isDetailsOpen = state.expandedDetails.has(card.id);

        const tokNoteHtml = card.totalTokens > 0
          ? '<span title="' + escapeHtml((Number(card.totalTokens) || 0).toLocaleString('en-US') + ' total tokens used') + '">· ' + escapeHtml(formatTokens(card.totalTokens)) + ' tok</span>'
          : '';

        return (
          '<div class="conv-row-top" data-action="open-chat" data-id="' + escapeHtml(card.id) + '">' +
            '<div class="conv-title-wrap">' +
              renderStatusBadge(card, true) +
              pinIconHtml +
              '<span class="conv-title">' + highlightSearchText(titleText, activeSearchQ) + '</span>' +
            '</div>' +
            '<span class="muted">' + escapeHtml(formatRelativeTime(card.lastActiveMs)) + '</span>' +
          '</div>' +
          previewsHtml +
          '<div class="conv-row-bottom">' +
            '<div class="conv-meta">' +
              '<span class="tier-label ' + tier.text + '">' +
                '<span class="dot-sm ' + tier.dot + '"></span>' +
                escapeHtml(tier.label) + ' · ' + card.compactCount +
              '</span>' +
              '<span>· ' + card.promptCount + ' prompts' + escapeHtml(compactedNote) + '</span>' +
              tokNoteHtml +
              renderSubagentPill(card, false) +
              gitNoteHtml +
              wsNoteHtml +
            '</div>' +
            renderSubagentsList(card) +
            '<div class="conv-actions">' +
              '<button class="ghost-btn" data-action="toggle-handoff" data-id="' + escapeHtml(card.id) + '">' +
                (isHandoffOpen ? 'Hide Handoff' : 'Handoff') +
              '</button>' +
              '<button class="ghost-btn" data-action="toggle-details" data-id="' + escapeHtml(card.id) + '">' +
                (isDetailsOpen ? 'Hide' : 'History') +
              '</button>' +
              renderCardGearMenu(card, true) +
            '</div>' +
          '</div>' +
          searchHitsHtml
        );
      }

      function createCardShell(className, headerClassName, convId) {
        const el = document.createElement('div');
        el.className = className;
        el.setAttribute('data-conv-id', convId);
        const isConvRow = className === 'conv-row';
        if (isConvRow) {
          el.setAttribute('data-action', 'open-chat');
          el.setAttribute('data-id', convId);
        }
        const headerActionAttrs = isConvRow
          ? ' data-action="open-chat" data-id="' + escapeHtml(convId) + '"'
          : '';
        el.innerHTML =
          '<div class="card-header-slot ' + headerClassName + '"' + headerActionAttrs + '></div>' +
          '<div class="card-handoff-slot card-slot" data-open="0"></div>' +
          '<div class="card-details-slot card-slot" data-rev="0"></div>';
        return el;
      }

      function syncCardDom(cardEl, card, headerHtml) {
        if (cardEl.classList.contains('conv-row')) {
          cardEl.classList.toggle('is-waiting', Boolean(card.waitState));
          cardEl.classList.toggle('is-unread', Boolean(!card.waitState && card.unread));
        }
        const headerSlot = cardEl.querySelector('.card-header-slot');
        if (headerSlot && headerSlot.innerHTML !== headerHtml) {
          headerSlot.innerHTML = headerHtml;
        }

        const handoffSlot = cardEl.querySelector('.card-handoff-slot');
        const isPending = Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);
        const hState = state.openHandoffId === card.id
          ? getHandoffState(card.id)
          : state.handoffStateByConv.get(card.id);
        const stepTag = hState && hState.step === 'ready' ? 'ready:' + (hState.loadedHandoffMs || 0) : 'focus';
        const wantHandoff = state.openHandoffId === card.id
          ? (isPending ? 'pending' : stepTag)
          : '0';
        if (handoffSlot && handoffSlot.getAttribute('data-open') !== wantHandoff) {
          handoffSlot.setAttribute('data-open', wantHandoff);
          handoffSlot.innerHTML = wantHandoff !== '0' ? renderHandoffDrawer(card) : '';
          if (wantHandoff !== '0') {
            const ta = handoffSlot.querySelector('textarea.handoff-input');
            if (ta) {
              ta.disabled = isPending;
              ta.readOnly = isPending;
              if (hState) {
                ta.value = hState.text;
              }
            }
            restoreScrollPositions(handoffSlot);
          }
        } else if (handoffSlot && wantHandoff !== '0') {
          const modelBar = handoffSlot.querySelector('.handoff-model-bar');
          const nextSyncKey = getModelSyncKey(card);
          if (modelBar && modelBar.getAttribute('data-model-sync-key') !== nextSyncKey) {
            modelBar.setAttribute('data-model-sync-key', nextSyncKey);
            modelBar.innerHTML = renderHandoffModelBarInner(card);
          }
        }

        const detailsSlot = cardEl.querySelector('.card-details-slot');
        const details = state.expandedDetails.get(card.id);
        const wantRev = details ? String(details._rev || 1) : '0';
        if (detailsSlot && detailsSlot.getAttribute('data-rev') !== wantRev) {
          detailsSlot.setAttribute('data-rev', wantRev);
          detailsSlot.innerHTML = details ? renderDetailsDrawer(card) : '';
          if (details && !details.loading) {
            restoreScrollPositions(detailsSlot);
          }
        }
      }

      function resolveNewChatTargetWorkspace(effectiveScope, pinnedCard) {
        if (
          state.newChatTargetKey &&
          state.newChatTargetKey !== '__all__' &&
          state.newChatTargetKey !== '__unscoped__'
        ) {
          const explicitWs = state.workspaces.find((w) => w.key === state.newChatTargetKey);
          if (explicitWs) return explicitWs;
        }
        if (effectiveScope && effectiveScope !== '__all__' && effectiveScope !== '__unscoped__') {
          const ws = state.workspaces.find((w) => w.key === effectiveScope);
          if (ws) return ws;
        }
        if (state.activeWorkspaceKey && state.activeWorkspaceKey !== '__unscoped__') {
          const ws = state.workspaces.find((w) => w.key === state.activeWorkspaceKey);
          if (ws) return ws;
        }
        if (pinnedCard && (pinnedCard.projectId || pinnedCard.workspacePath)) {
          return {
            key: pinnedCard.workspaceKey || '',
            projectId: pinnedCard.projectId || '',
            path: pinnedCard.workspacePath || '',
            name: pinnedCard.workspaceName || 'Current Project'
          };
        }
        const firstProjWs = state.workspaces.find((w) => w.key !== '__unscoped__' && (w.projectId || w.path));
        return firstProjWs || null;
      }

      function renderNewChatDrawer(effectiveScope, pinnedCard) {
        if (!newChatSlotEl) return;
        if (btnToggleNewChatEl) {
          btnToggleNewChatEl.classList.toggle('active', Boolean(state.newChatOpen));
        }
        if (!state.newChatOpen) {
          if (newChatSlotEl.innerHTML !== '') {
            newChatSlotEl.innerHTML = '';
          }
          return;
        }

        const targetWs = resolveNewChatTargetWorkspace(effectiveScope, pinnedCard);
        const hasProjectTarget = Boolean(targetWs && (targetWs.projectId || targetWs.path));
        const isGeneral =
          state.newChatTargetKey === '__unscoped__' ||
          !hasProjectTarget ||
          Boolean(state.newChatGeneral);

        const projectWorkspaces = [];
        const seenWsKeys = new Set();
        for (const w of state.workspaces) {
          if (w && w.key && w.key !== '__unscoped__' && (w.projectId || w.path)) {
            seenWsKeys.add(w.key);
            projectWorkspaces.push(w);
          }
        }
        if (hasProjectTarget && targetWs.key && !seenWsKeys.has(targetWs.key)) {
          projectWorkspaces.unshift(targetWs);
        }

        const scopeKey = [
          projectWorkspaces.map((w) => w.key).join(','),
          hasProjectTarget ? (targetWs.key || targetWs.name) : 'none',
          isGeneral ? 'general' : 'project',
          state.newChatSending ? 'sending' : 'idle'
        ].join('|');
        const nextModelSyncKey = getNewChatModelSyncKey(pinnedCard);

        const existingDrawer = newChatSlotEl.querySelector('.new-chat-drawer');
        if (existingDrawer && existingDrawer.getAttribute('data-scope-key') === scopeKey) {
          const modelBar = existingDrawer.querySelector('.handoff-model-bar');
          if (modelBar && modelBar.getAttribute('data-model-sync-key') !== nextModelSyncKey) {
            modelBar.setAttribute('data-model-sync-key', nextModelSyncKey);
            modelBar.innerHTML = renderNewChatModelBarInner(pinnedCard);
          }
          return;
        }

        const activeTa = existingDrawer ? existingDrawer.querySelector('.new-chat-textarea') : null;
        if (activeTa) {
          state.newChatText = activeTa.value;
        }

        let selectOptsHtml = '';
        for (const w of projectWorkspaces) {
          const isSel = !isGeneral && targetWs && w.key === targetWs.key ? ' selected' : '';
          selectOptsHtml +=
            '<option value="' + escapeHtml(w.key) + '"' + isSel + '>' +
              escapeHtml(w.name) +
            '</option>';
        }
        selectOptsHtml +=
          '<option value="__unscoped__"' + (isGeneral ? ' selected' : '') + '>No Project (General)</option>';

        newChatSlotEl.innerHTML =
          '<div class="new-chat-drawer" data-scope-key="' + escapeHtml(scopeKey) + '">' +
            '<div class="new-chat-scope-row">' +
              '<div class="handoff-model-group" style="flex:1;min-width:0;">' +
                '<span class="handoff-model-label">Project</span>' +
                '<select class="handoff-select" id="new-chat-project-select" style="max-width:100%;flex:1;min-width:0;"' + (state.newChatSending ? ' disabled' : '') + '>' +
                  selectOptsHtml +
                '</select>' +
              '</div>' +
            '</div>' +
            '<textarea class="new-chat-textarea" id="new-chat-textarea" rows="5" placeholder="Write a prompt to start a new conversation... (Ctrl+Enter to send)"' + (state.newChatSending ? ' readonly' : '') + '>' +
              escapeHtml(state.newChatText) +
            '</textarea>' +
            '<div class="handoff-model-bar" data-model-sync-key="' + escapeHtml(nextModelSyncKey) + '">' +
              renderNewChatModelBarInner(pinnedCard) +
            '</div>' +
            '<div style="display:flex;align-items:center;justify-content:flex-end;gap:6px;">' +
              '<button class="ghost-btn" data-action="toggle-new-chat"' + (state.newChatSending ? ' disabled' : '') + '>Cancel</button>' +
              '<button class="btn-solid" data-action="submit-new-chat"' + (state.newChatSending ? ' disabled' : '') + '>' +
                (state.newChatSending ? 'Starting...' : 'Start Chat') +
              '</button>' +
            '</div>' +
          '</div>';

        const nextTa = newChatSlotEl.querySelector('.new-chat-textarea');
        if (nextTa) {
          nextTa.value = state.newChatText;
        }
      }

      function renderWorkspacePills(effectiveScope, pinnedId) {
        const allMain = state.conversations.filter((c) => !c.isSubagent);
        let totalMainCount = 0;
        const countsByWs = new Map();
        const unreadByWs = new Map();
        const thinkingByWs = new Map();
        const waitPermByWs = new Map();
        const waitQuestionByWs = new Map();
        const isActiveIframe = isThisIframeActiveConv();
        for (const c of allMain) {
          const k = c.workspaceKey || '__unscoped__';
          if (c.waitState === 'permission') waitPermByWs.set(k, true);
          else if (c.waitState === 'question') waitQuestionByWs.set(k, true);
          else if (c.isThinking) thinkingByWs.set(k, true);
          if (c.promptCount > 0 || c.lastActiveMs > 0) {
            totalMainCount += 1;
            countsByWs.set(k, (countsByWs.get(k) || 0) + 1);
          }
          if (c.unread && !(c.id === pinnedId && effectiveScope === k && isActiveIframe)) {
            unreadByWs.set(k, true);
          }
        }

        let html = '';
        for (const ws of state.workspaces) {
          const totalCount = countsByWs.get(ws.key) || 0;
          const isRegisteredProject = Boolean(ws.projectId && ws.path);
          const hasWaitPerm = Boolean(waitPermByWs.get(ws.key));
          const hasWaitQuestion = Boolean(waitQuestionByWs.get(ws.key));
          const hasUnread = Boolean(unreadByWs.get(ws.key));
          const hasThinking = Boolean(thinkingByWs.get(ws.key));
          if (
            !isRegisteredProject &&
            totalCount === 0 &&
            !hasWaitPerm &&
            !hasWaitQuestion &&
            !hasThinking &&
            !hasUnread &&
            effectiveScope !== ws.key
          ) {
            continue;
          }
          const isActive = effectiveScope === ws.key;
          const projAttrs = ws.projectId
            ? ' data-project-id="' + escapeHtml(ws.projectId) + '" data-project-name="' + escapeHtml(ws.name) + '"'
            : '';
          const tip = ws.projectId
            ? (ws.path ? ws.path + ' · Right-click for options' : 'Right-click for options')
            : (ws.path ? ws.path + ' · Right-click to start new chat' : 'Right-click to start new chat');
          let indicatorHtml = '';
          if (hasWaitPerm) {
            indicatorHtml += '<span class="wait-badge" title="Waiting for permission approval in this project">!</span>';
          }
          if (hasWaitQuestion) {
            indicatorHtml += '<span class="wait-badge" title="Waiting for your answer in this project">?</span>';
          }
          if (hasThinking) {
            indicatorHtml += '<span class="thinking-dots" title="Agent is thinking in this project"><span></span><span></span><span></span></span>';
          }
          if (hasUnread) {
            indicatorHtml += '<span class="unread-dot" title="Unread reply in this project"></span>';
          }
          html +=
            '<button class="scope-tab ' + (isActive ? 'active' : '') + '" data-ws="' + escapeHtml(ws.key) + '" data-ws-name="' + escapeHtml(ws.name) + '"' + projAttrs + ' title="' + escapeHtml(tip) + '">' +
              indicatorHtml +
              '<span>' + escapeHtml(ws.name) + ' (' + totalCount + ')</span>' +
            '</button>';
        }

        html +=
          '<button class="scope-tab ' + (effectiveScope === '__all__' ? 'active' : '') + '" data-ws="__all__">' +
            '<span>All (' + totalMainCount + ')</span>' +
          '</button>';

        const archivedProjCount = Array.isArray(state.archivedProjects) ? state.archivedProjects.length : 0;
        const archivedConvCount = Array.isArray(state.archivedConversations) ? state.archivedConversations.length : 0;
        const totalArchivedCount = archivedProjCount + archivedConvCount;
        if (totalArchivedCount > 0) {
          html +=
            '<button class="scope-tab scope-tab-archived" data-action="open-archived-modal" title="View and restore archived conversations and projects">' +
              'Archived (' + totalArchivedCount + ')' +
            '</button>';
        }

        if (workspacePillsEl.innerHTML !== html) {
          workspacePillsEl.innerHTML = html;
        }
      }

      function getCardFocusMs(card) {
        if (!card) return 0;
        return Math.max(Number(card.lastViewMs) || 0, Number(card.lastUserInputMs) || 0);
      }

      // Opt-in unread/claim tracing, active only while the server reports traceEnabled (see
      // "Unread / Blue Dot Debugging" in AGENTS.md). inst tells the per-chat aux pane iframes apart.
      const uiTraceBuf = [];
      let uiTraceLastSig = '';
      const uiTraceInstance = Math.random().toString(36).slice(2, 7);
      function uiTrace(ev, extra) {
        if (!state.traceEnabled) return;
        uiTraceBuf.push(Object.assign({ src: 'ui', inst: uiTraceInstance, t: Date.now(), ev }, extra || {}));
      }
      function uiTraceSnapshot(effectiveScope) {
        if (!state.traceEnabled) return;
        let claimed = '';
        try { claimed = (localStorage.getItem(ACTIVE_CONV_STORAGE_KEY) || '').slice(0, 8); } catch {}
        const tabs = [...workspacePillsEl.querySelectorAll('[data-ws]')].map((b) =>
          b.getAttribute('data-ws').slice(-14) +
          (b.querySelector('.thinking-dots') ? ':dots' : '') +
          (b.querySelector('.unread-dot') ? ':BLUE' : '')
        );
        const snap = {
          initialHost: initialHostConvId.slice(0, 8),
          host: (state.hostConvId || '').slice(0, 8),
          manualPin: (state.manualPinId || '').slice(0, 8),
          pinned: (state.lastPinnedId || '').slice(0, 8),
          sel: state.selectedWorkspaceKey.slice(-14),
          scope: String(effectiveScope || '').slice(-14),
          activeWs: (state.activeWorkspaceKey || '').slice(-14),
          claimed,
          focus: document.hasFocus(),
          hidden: isIframeHidden(),
          active: isThisIframeActiveConv(),
          tabs
        };
        const sig = JSON.stringify(snap);
        if (sig !== uiTraceLastSig) {
          uiTraceLastSig = sig;
          uiTrace('render', snap);
        }
      }
      setInterval(() => {
        if (uiTraceBuf.length === 0) return;
        const lines = uiTraceBuf.splice(0, uiTraceBuf.length);
        void apiFetch('/api/debug-trace', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ lines })
        }).catch(() => {});
      }, 1000);

      function pickMostRecentFocusCard(cards) {
        let best = null;
        let bestFocusMs = -1;
        let bestActiveMs = -1;
        for (const c of cards) {
          const focusMs = getCardFocusMs(c);
          const activeMs = Number(c.lastActiveMs) || 0;
          if (focusMs > bestFocusMs || (focusMs === bestFocusMs && activeMs > bestActiveMs)) {
            bestFocusMs = focusMs;
            bestActiveMs = activeMs;
            best = c;
          }
        }
        return best;
      }

      function renderAll() {
        const mainChats = state.conversations.filter((c) => !c.isSubagent);
        const wsFocusChats = state.activeWorkspaceKey
          ? mainChats.filter((c) => c.workspaceKey === state.activeWorkspaceKey)
          : [];

        if (initialHostConvId) {
          state.hostConvId = initialHostConvId;
        }

        const hostCard = state.hostConvId
          ? state.conversations.find((c) => c.id === state.hostConvId)
          : null;
        const candidatePool = state.activeWorkspaceKey
          ? wsFocusChats
          : (mainChats.length > 0 ? mainChats : state.conversations);
        const newestWsCard = pickMostRecentFocusCard(candidatePool);

        let pinnedCard = hostCard || newestWsCard;
        if (!initialHostConvId) {
          const isManuallyPinned = Boolean(hostCard && state.manualPinId && state.manualPinId === hostCard.id);
          const isPendingOnHost = Boolean(
            hostCard && state.pendingSmartHandoff && state.pendingSmartHandoff.convId === hostCard.id
          );
          const manualPinRecent = Boolean(
            state.manualPinId && (Date.now() - state.manualPinTs) < 15000
          );
          const hostDifferentWs =
            Boolean(state.activeWorkspaceKey) &&
            Boolean(hostCard) &&
            hostCard.workspaceKey !== state.activeWorkspaceKey;

          if (isPendingOnHost) {
            pinnedCard = hostCard;
          } else if (hostCard && hostDifferentWs && !isManuallyPinned) {
            pinnedCard = newestWsCard;
            state.hostConvId = newestWsCard ? newestWsCard.id : '';
          } else if (hostCard && newestWsCard && newestWsCard.id !== hostCard.id) {
            const newestTs = getCardFocusMs(newestWsCard);
            const hostTs = getCardFocusMs(hostCard);
            // On every chat switch Antigravity stamps the same last_user_view_time on both the left and the
            // entered chat, so the chat the user just left gets a lastViewMs newer than this manual pin.
            // Only a newer user prompt elsewhere may override an explicit pin.
            const newActivityAfterManualPin =
              !state.manualPinId || (Number(newestWsCard.lastUserInputMs) || 0) > state.manualPinTs;

            if (newestTs > hostTs && newActivityAfterManualPin) {
              pinnedCard = newestWsCard;
              state.hostConvId = newestWsCard.id;
              state.manualPinId = '';
            }
          } else if (!hostCard && newestWsCard && !manualPinRecent) {
            state.hostConvId = newestWsCard.id;
          }
        }

        const pinnedId = pinnedCard ? pinnedCard.id : '';
        if (state.lastPinnedId && pinnedId && state.lastPinnedId !== pinnedId) {
          state.selectedWorkspaceKey = '__auto__';
          clearSearchState();
          const isOldPending = Boolean(
            state.pendingSmartHandoff && state.pendingSmartHandoff.convId === state.lastPinnedId
          );
          if (state.openHandoffId === state.lastPinnedId && !isOldPending) {
            state.openHandoffId = null;
          }
        }
        state.lastPinnedId = pinnedId;

        if (pinnedCard) {
          const prevUserMs = state.prevUserInputMsById.get(pinnedCard.id);
          const curUserMs = Number(pinnedCard.lastUserInputMs) || 0;
          const isNewUserPrompt = prevUserMs !== undefined
            ? curUserMs > prevUserMs
            : (state.hasSeededUserInputMs && curUserMs > 0);
          if (isNewUserPrompt && state.selectedWorkspaceKey !== '__auto__') {
            state.selectedWorkspaceKey = '__auto__';
          }
        }

        const effectiveScope = resolveEffectiveWorkspaceScope(pinnedCard);
        maybeTakeOverActiveClaim();
        if (pinnedCard) {
          const wasThinking = Boolean(state.prevThinkingById.get(pinnedCard.id));
          const prevRespMs = state.prevModelRespMsById.get(pinnedCard.id);
          const curRespMs = Number(pinnedCard.lastModelResponseMs) || 0;
          const justCompletedReply =
            !pinnedCard.isThinking &&
            !pinnedCard.waitState &&
            (wasThinking || (prevRespMs !== undefined && curRespMs > prevRespMs));
          // The claim gate (isThisIframeActiveConv) is what keeps hidden aux pane iframes from clearing
          // the dot of their own chat; see the unread model notes above ACTIVE_CONV_STORAGE_KEY.
          if (pinnedCard.unread && justCompletedReply && isThisIframeActiveConv()) {
            markConversationSeenInServer(pinnedCard.id);
          }
        }
        const nextThinkingById = new Map();
        const nextModelRespMsById = new Map();
        const nextUserInputMsById = new Map();
        for (const c of mainChats) {
          nextThinkingById.set(c.id, Boolean(c.isThinking || c.waitState));
          nextModelRespMsById.set(c.id, Number(c.lastModelResponseMs) || 0);
          nextUserInputMsById.set(c.id, Number(c.lastUserInputMs) || 0);
        }
        state.prevThinkingById = nextThinkingById;
        state.prevModelRespMsById = nextModelRespMsById;
        state.prevUserInputMsById = nextUserInputMsById;
        state.hasSeededUserInputMs = true;

        if (pinnedCard) {
          let activeCardEl = pinnedContainer.querySelector('.active-card');
          if (!activeCardEl || activeCardEl.getAttribute('data-conv-id') !== pinnedCard.id) {
            pinnedContainer.innerHTML = '';
            activeCardEl = createCardShell('active-card', 'active-card-header', pinnedCard.id);
            pinnedContainer.appendChild(activeCardEl);
          }
          syncCardDom(activeCardEl, pinnedCard, renderActiveCardHeader(pinnedCard, effectiveScope));
          activeWsIndicator.textContent = pinnedCard.workspaceName ? '· ' + pinnedCard.workspaceName : '';
        } else {
          statusDotEl.className = 'dot dot-fresh';
          const emptyPinnedMsg = state.activeWorkspaceKey
            ? 'No active conversation in this workspace yet.'
            : 'No active conversation detected yet.';
          const emptyPinnedHtml = '<div class="empty-box">' + emptyPinnedMsg + '</div>';
          if (pinnedContainer.innerHTML !== emptyPinnedHtml) {
            pinnedContainer.innerHTML = emptyPinnedHtml;
          }
          activeWsIndicator.textContent = '';
        }

        renderNewChatDrawer(effectiveScope, pinnedCard);
        renderWorkspacePills(effectiveScope, pinnedId);
        uiTraceSnapshot(effectiveScope);
        renderDiagnosticsSticky();
        renderPluginUpdateButton();
        renderQuotaPill(pinnedCard);
        refreshQuotaModal();
        refreshContextBreakdownModalOnPoll();

        const rawQuery = (state.lastFetchedQuery || '').trim();
        const q = rawQuery.toLowerCase();
        const filtered = state.conversations.filter((c) => {
          if (c.isSubagent) return false;
          if (c.id === pinnedId) return false;
          if (effectiveScope !== '__all__') {
            const cKey = c.workspaceKey || '__unscoped__';
            if (cKey !== effectiveScope) return false;
          }
          if (q) {
            if (!state.searchMatches || !state.searchMatches[c.id]) return false;
          }
          return true;
        });
        filtered.sort((a, b) => {
          const aPin = Boolean(a.pinned);
          const bPin = Boolean(b.pinned);
          if (aPin !== bPin) return aPin ? -1 : 1;
          if (aPin && bPin) {
            const pinDiff = (Number(b.pinnedAtMs) || 0) - (Number(a.pinnedAtMs) || 0);
            if (pinDiff !== 0) return pinDiff;
          }
          return (Number(b.lastActiveMs) || 0) - (Number(a.lastActiveMs) || 0);
        });

        const wsObj = state.workspaces.find((w) => w.key === effectiveScope);
        const scopeTitle = effectiveScope === '__all__'
          ? 'Other conversations (All)'
          : 'Other conversations in ' + ((wsObj && wsObj.name) || 'workspace');
        listHeaderTitle.textContent = scopeTitle;
        listHeaderCount.textContent = filtered.length + ' chat' + (filtered.length === 1 ? '' : 's');

        if (sectionOtherEl && sectionOtherEl.classList.contains('collapsed')) {
          return;
        }

        const showWsName = effectiveScope === '__all__';
        if (filtered.length === 0) {
          const hasAnyInScope =
            effectiveScope === '__all__' ||
            mainChats.some(
              (c) => (c.promptCount > 0 || c.lastActiveMs > 0) && (c.workspaceKey || '__unscoped__') === effectiveScope
            );
          const emptyMsg = effectiveScope !== '__all__'
            ? (hasAnyInScope
                ? 'No other conversations in this workspace. Select "All" to browse other projects.'
                : 'No conversations in this project yet. Click "+ New" to start one.')
            : 'No other conversations match the current filter.';
          const emptyHtml = rawQuery
            ? '<div class="empty-box no-results">No results for \'' + escapeHtml(rawQuery) + '\'</div>'
            : '<div class="empty-box">' + emptyMsg + '</div>';
          if (cardsContainer.innerHTML !== emptyHtml) {
            cardsContainer.innerHTML = emptyHtml;
          }
        } else {
          const emptyBox = cardsContainer.querySelector(':scope > .empty-box');
          if (emptyBox) emptyBox.remove();

          const existingById = new Map();
          for (const child of Array.from(cardsContainer.children)) {
            const cid = child.getAttribute && child.getAttribute('data-conv-id');
            if (cid) {
              existingById.set(cid, child);
            } else {
              child.remove();
            }
          }

          const wantedIds = new Set(filtered.map((c) => c.id));
          for (const [cid, el] of existingById.entries()) {
            if (!wantedIds.has(cid)) {
              el.remove();
              existingById.delete(cid);
            }
          }

          const activeInCards =
            document.activeElement &&
            cardsContainer.contains(document.activeElement) &&
            (document.activeElement.tagName === 'TEXTAREA' ||
              document.activeElement.tagName === 'INPUT' ||
              document.activeElement.tagName === 'SELECT');
          const anyRowHasOpenMenuOrFocus =
            Boolean(activeInCards) ||
            filtered.some((c) => state.openMenuConvId === c.id);

          for (let i = 0; i < filtered.length; i++) {
            const c = filtered[i];
            let rowEl = existingById.get(c.id);
            if (!rowEl) {
              rowEl = createCardShell('conv-row', 'conv-row-header', c.id);
              existingById.set(c.id, rowEl);
              cardsContainer.appendChild(rowEl);
            }
            if (!anyRowHasOpenMenuOrFocus && cardsContainer.children[i] !== rowEl) {
              cardsContainer.insertBefore(rowEl, cardsContainer.children[i] || null);
            }
            syncCardDom(rowEl, c, renderCompactRowHeader(c, showWsName));
          }
        }
      }

      function renderPluginUpdateButton() {
        if (!btnUpdate) return;
        const pu = state.pluginUpdate;
        const hasUpdate = Boolean(pu && pu.updateAvailable);
        if (updateDotEl) updateDotEl.style.display = hasUpdate ? 'inline-block' : 'none';
        btnUpdate.classList.toggle('has-update', hasUpdate);
        btnUpdate.disabled = Boolean(state.pluginUpdating);
        if (btnUpdateLabelEl) btnUpdateLabelEl.textContent = state.pluginUpdating ? 'Updating...' : 'Update';
        if (state.pluginUpdating) {
          btnUpdate.title = 'Checking and applying AGY Cockpit update...';
        } else if (hasUpdate) {
          btnUpdate.title = 'Update available on GitHub (' + (pu?.installedShort || 'installed') + ' -> ' + (pu?.remoteShort || 'latest') + '). Click to update and reload.';
        } else if (pu && pu.installedShort) {
          btnUpdate.title = 'AGY Cockpit (' + pu.installedShort + '). Click to check GitHub for updates.';
        } else {
          btnUpdate.title = 'Check for AGY Cockpit updates on GitHub';
        }
      }

      function renderDiagnosticsSticky() {
        if (!diagStickyEl) return;
        const diag = state.diagnostics;
        const issues = diag && Array.isArray(diag.issues) ? diag.issues : [];
        const sig = (diag && diag.signature) || 'ok';
        const hasIssues = Boolean(diag && diag.status !== 'ok' && issues.length > 0 && sig !== state.dismissedDiagSig);

        if (!hasIssues) {
          if (diagStickyEl.style.display !== 'none') {
            diagStickyEl.style.display = 'none';
            diagStickyEl.innerHTML = '';
            diagStickyEl.removeAttribute('data-render-key');
          }
          if (appShellEl) appShellEl.classList.remove('has-diag-bar');
          return;
        }

        const isFail = diag.status === 'fail' || (diag.failCount || 0) > 0;
        const renderKey = [
          sig,
          state.diagExpanded ? 'open' : 'closed',
          state.diagRechecking ? 'rechecking' : 'idle'
        ].join('|');

        if (diagStickyEl.style.display === 'none') {
          diagStickyEl.style.display = 'flex';
        }
        if (appShellEl) appShellEl.classList.add('has-diag-bar');
        if (diagStickyEl.getAttribute('data-render-key') === renderKey) {
          return;
        }
        diagStickyEl.setAttribute('data-render-key', renderKey);

        const firstIssue = issues[0];
        const shortLabel =
          (diag.agyUpdated ? 'AGY Update: ' : 'AGY API Issue: ') +
          issues.length +
          (issues.length === 1 ? ' contract (' + firstIssue.id + ')' : ' contracts');

        let drawerHtml = '';
        if (state.diagExpanded) {
          let cardsHtml = '';
          for (const item of issues) {
            const bClass = item.status === 'fail' ? 'fail' : 'warn';
            cardsHtml +=
              '<div class="diag-issue-card">' +
                '<div class="diag-issue-top">' +
                  '<div style="display:flex;align-items:center;gap:6px;">' +
                    '<span class="diag-badge ' + bClass + '">' + escapeHtml(item.status) + '</span>' +
                    '<strong style="font-size:12.5px;color:var(--foreground,#ededed);">' + escapeHtml(item.title || item.id) + '</strong>' +
                  '</div>' +
                  '<span class="diag-symbol">' + escapeHtml(item.codeSymbol || '') + '</span>' +
                '</div>' +
                '<div style="color:var(--foreground,#e2e2e2);">' + escapeHtml(item.detail || '') + '</div>' +
                (item.fixHint
                  ? '<div class="muted" style="font-size:11.5px;">Fix: ' + escapeHtml(item.fixHint) + '</div>'
                  : '') +
              '</div>';
          }
          drawerHtml =
            '<div class="diag-drawer' + (isFail ? ' is-fail' : '') + '">' +
              '<div class="diag-drawer-head">' +
                '<span>Antigravity Contract Verifier (' + issues.length + ')</span>' +
                '<div style="display:flex;align-items:center;gap:5px;">' +
                  '<button class="ghost-btn" data-action="diag-recheck"' + (state.diagRechecking ? ' disabled' : '') + '>' +
                    (state.diagRechecking ? 'Checking...' : 'Re-run Doctor') +
                  '</button>' +
                  '<button class="btn-solid" style="padding:3px 9px;font-size:12px;" data-action="diag-copy">Copy Fix Prompt</button>' +
                '</div>' +
              '</div>' +
              cardsHtml +
            '</div>';
        }

        const barHtml =
          '<div class="diag-bar' + (isFail ? ' is-fail' : '') + '">' +
            '<div class="diag-bar-left" data-action="diag-toggle" title="Click to inspect broken or changed AGY contracts">' +
              '<span class="dot-sm ' + (isFail ? 'dot-polluted' : 'dot-heavy') + '"></span>' +
              '<span class="diag-bar-title">' + escapeHtml(shortLabel) + '</span>' +
            '</div>' +
            '<div class="diag-bar-actions">' +
              '<button class="ghost-btn" style="padding:2px 7px;font-size:12px;" data-action="diag-toggle">' +
                (state.diagExpanded ? 'Hide' : 'Details') +
              '</button>' +
              '<button class="ghost-btn" style="padding:2px 7px;font-size:12px;" data-action="diag-copy" title="Copy diagnostic fix prompt for agent">Copy Fix</button>' +
              '<button class="ghost-btn" style="padding:2px 6px;font-size:13px;" data-action="diag-dismiss" title="Dismiss warning for this session">×</button>' +
            '</div>' +
          '</div>';

        diagStickyEl.innerHTML = drawerHtml + barHtml;
      }

      async function handleRecheckDiagnostics() {
        if (state.diagRechecking) return;
        state.diagRechecking = true;
        renderDiagnosticsSticky();
        try {
          const qs = new URLSearchParams({ refresh: '1' });
          if (urlSimulateDiag) qs.set('simulate', urlSimulateDiag);
          const res = await apiFetch('/api/diagnostics?' + qs.toString());
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const report = await res.json();
          const issues = Array.isArray(report.contracts)
            ? report.contracts.filter((c) => c.status !== 'pass')
            : [];
          state.diagnostics = {
            status: report.status || 'ok',
            issueCount: issues.length,
            failCount: report.failCount || 0,
            warnCount: report.warnCount || 0,
            signature: report.signature || 'ok',
            checkedAtMs: report.checkedAtMs || Date.now(),
            agyUpdated: Boolean(report.agyUpdated),
            issues
          };
          if (issues.length === 0) {
            state.diagExpanded = false;
            showToast('All AGY contracts healthy!');
          } else {
            showToast('Doctor found ' + issues.length + ' contract issue(s)');
          }
        } catch (err) {
          showToast('Doctor check failed: ' + err.message);
        } finally {
          state.diagRechecking = false;
          renderDiagnosticsSticky();
        }
      }

      async function handleCopyDiagnosticsFixPrompt() {
        const diag = state.diagnostics;
        const issues = diag && Array.isArray(diag.issues) ? diag.issues : [];
        if (issues.length === 0) return;
        const lines = [
          'AGY Cockpit Contract Verifier detected Antigravity (AGY) API/schema drift:',
          ''
        ];
        for (const item of issues) {
          lines.push(`- [${String(item.status || '').toUpperCase()}] ${item.id} (${item.title})`);
          if (item.codeSymbol) lines.push(`  Target: ${item.codeSymbol}`);
          if (item.detail) lines.push(`  Detail: ${item.detail}`);
          if (item.fixHint) lines.push(`  Fix Hint: ${item.fixHint}`);
        }
        lines.push('');
        lines.push('Run `node setup.cjs --doctor` (and `/agy-api-audit` if needed) and fix the affected contracts in the agy-cockpit repository (sidecars/agy-cockpit/server.cjs, sidecars/agy-cockpit/ui.html, setup.cjs).');
        await copyTextToClipboard(lines.join('\n'));
        showToast('Copied AGY contract fix prompt');
      }

      async function fetchStatus(force = false) {
        if (!force && (state.pollInFlight || state.pluginUpdating)) return;
        state.pollInFlight = true;
        let pollOk = false;
        try {
          const currentQuery = state.searchQuery.replace(/\s+/g, ' ').trim();
          const queryChanged = currentQuery !== state.lastFetchedQuery;
          const params = new URLSearchParams();
          if (!force && !queryChanged && state.version > 0 && !urlSimulateDiag) {
            params.set('sinceVersion', String(state.version));
          }
          if (force) params.set('force', '1');
          if (urlSimulateDiag) params.set('simulateDiag', urlSimulateDiag);
          if (state.hostConvId) params.set('activeConvId', state.hostConvId);
          const candidateViewId = state.lastPinnedId || state.hostConvId;
          const candidateViewCard = candidateViewId
            ? state.conversations.find((c) => c.id === candidateViewId)
            : null;
          if (
            isThisIframeActiveConv() &&
            candidateViewId &&
            (!candidateViewCard || (!candidateViewCard.isThinking && !candidateViewCard.waitState && !candidateViewCard.unread))
          ) {
            params.set('viewedConvId', candidateViewId);
          }
          if (state.workspaceUris.length > 0) {
            params.set('workspaceUris', JSON.stringify(state.workspaceUris));
          }
          if (currentQuery) {
            params.set('q', currentQuery);
          }

          const res = await apiFetch('/api/status?' + params.toString());
          if (!res.ok) return;
          pollOk = true;
          const data = await res.json();
          if (data.uiMtimeMs) {
            if (state.uiMtimeMs > 0 && data.uiMtimeMs !== state.uiMtimeMs) {
              window.location.reload();
              return;
            }
            state.uiMtimeMs = data.uiMtimeMs;
          }
          state.traceEnabled = Boolean(data.traceEnabled);
          if (data.unchanged && !force && !queryChanged && !urlSimulateDiag) return;

          state.version = data.version || state.version;
          const latestQueryNow = state.searchQuery.replace(/\s+/g, ' ').trim();
          if (!latestQueryNow) {
            state.lastFetchedQuery = '';
            state.searchMatches = null;
          } else if (currentQuery) {
            state.lastFetchedQuery = currentQuery;
            state.searchMatches = data.searchMatches || null;
          }
          if (data.hostConversationId && !state.hostConvId) {
            state.hostConvId = String(data.hostConversationId).trim().toLowerCase();
          }
          state.activeWorkspaceKey = data.activeWorkspaceKey || '';
          state.workspaces = Array.isArray(data.workspaces) ? data.workspaces : [];
          state.archivedProjects = Array.isArray(data.archivedProjects) ? data.archivedProjects : [];
          state.archivedConversations = Array.isArray(data.archivedConversations) ? data.archivedConversations : [];
          if (Array.isArray(data.availableModels) && data.availableModels.length > 0) {
            state.availableModels = data.availableModels;
          }
          if (data.defaultModelEnum) {
            state.defaultModelEnum = data.defaultModelEnum;
          }
          state.quota = data.quota && Array.isArray(data.quota.groups) && data.quota.groups.length > 0
            ? data.quota
            : null;
          if (data.diagnostics) {
            state.diagnostics = data.diagnostics;
          }
          if (data.pluginUpdate) {
            state.pluginUpdate = data.pluginUpdate;
          }
          state.conversations = Array.isArray(data.conversations) ? data.conversations : [];

          syncAllHandoffStates();
          renderAll();
          await checkPendingSmartHandoff();
        } catch (err) {
          console.error('[AgyCockpit] status poll failed:', err);
        } finally {
          state.pollInFlight = false;
          state.lastPollDoneMs = Date.now();
          const pendingQuery = state.searchQuery.replace(/\s+/g, ' ').trim();
          if (pollOk && pendingQuery !== state.lastFetchedQuery) {
            fetchStatus(false);
          }
        }
      }

      function cancelPendingSmartHandoff(abortRemote = false) {
        const pending = state.pendingSmartHandoff;
        state.pendingSmartHandoff = null;
        if (pending && pending.convId) {
          const card = state.conversations.find((c) => c.id === pending.convId);
          const hState = getHandoffState(pending.convId);
          hState.step = 'focus';
          if (abortRemote) {
            hState.cancelledPending = true;
            hState.dismissedHandoffMs = Math.max(
              hState.dismissedHandoffMs || 0,
              hState.loadedHandoffMs || 0,
              pending.baselineHandoffMs || 0,
              (card && Number(card.latestHandoffMs)) || 0,
              Date.now()
            );
            apiFetch('/api/cancel-invocation', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ conversationId: pending.convId })
            }).catch(() => {});
            showToast('Cancelled handoff generation');
          }
        }
        renderAll();
      }

      async function checkPendingSmartHandoff() {
        const pending = state.pendingSmartHandoff;
        if (!pending || !pending.sent || pending.completing) return;

        if (Date.now() - pending.requestedAtMs > 180000) {
          cancelPendingSmartHandoff(false);
          showToast('Smart handoff timed out waiting for agent response');
          return;
        }

        const conv = state.conversations.find((c) => c.id === pending.convId);
        if (!conv || conv.awaitingHandoffResponse) return;

        const handoffMs = Number(conv.latestHandoffMs) || 0;
        const hasNewHandoff =
          Boolean(conv.latestHandoffPrompt) &&
          handoffMs > pending.baselineHandoffMs;

        if (!hasNewHandoff) return;

        pending.completing = true;
        const convId = pending.convId;
        const finalPrompt = conv.latestHandoffPrompt;
        const hState = getHandoffState(convId);
        hState.cancelledPending = false;
        hState.text = finalPrompt;
        hState.step = 'ready';
        hState.loadedHandoffMs = Math.max(handoffMs, hState.dismissedHandoffMs || 0, (pending.baselineHandoffMs || 0) + 1);
        state.scrollPositions.set(convId + ':handoff', 0);
        state.pendingSmartHandoff = null;

        renderAll();
        showToast('AI handoff prompt ready for review');
      }

      async function handleSmartHandoffRun(convId) {
        if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
          return;
        }
        const card = state.conversations.find((c) => c.id === convId);
        const hState = getHandoffState(convId);
        const focus = readCurrentHandoffText(convId).trim();
        state.openHandoffId = convId;

        const initialBaselineMs = (card && Number(card.latestHandoffMs)) || 0;
        hState.cancelledPending = false;
        state.pendingSmartHandoff = {
          convId,
          baselineHandoffMs: initialBaselineMs,
          baselinePromptText: (card && card.latestHandoffPrompt) || '',
          requestedAtMs: Date.now(),
          sent: false,
          completing: false
        };
        renderAll();

        try {
          const { data } = await fetchHandoffData(convId, focus);
          if (!state.pendingSmartHandoff || state.pendingSmartHandoff.convId !== convId) {
            return;
          }

          if (window.sidecar && window.sidecar.agent && typeof window.sidecar.agent.sendMessage === 'function') {
            const baselineHandoffMs = Math.max(
              initialBaselineMs,
              (card && Number(card.latestHandoffMs)) || 0,
              Number(data.latestHandoffMs) || 0
            );
            state.pendingSmartHandoff.baselineHandoffMs = baselineHandoffMs;
            state.pendingSmartHandoff.baselinePromptText =
              data.latestHandoffPrompt || (card && card.latestHandoffPrompt) || '';
            state.pendingSmartHandoff.sent = true;
            hState.loadedHandoffMs = Math.max(hState.loadedHandoffMs || 0, baselineHandoffMs);

            try {
              const res = await window.sidecar.agent.sendMessage(data.promptForAgentHandoff, convId);
              if (res && res.error) {
                throw new Error(res.error);
              }
              if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
                showToast('Agent is drafting smart handoff...');
              }
              return;
            } catch (agentErr) {
              if (!state.pendingSmartHandoff || state.pendingSmartHandoff.convId !== convId) {
                return;
              }
              cancelPendingSmartHandoff(false);
              console.warn('[AgyCockpit] agent sendMessage failed:', agentErr);
              showToast('Agent unavailable: ' + agentErr.message);
              return;
            }
          }

          state.pendingSmartHandoff = null;
          renderAll();
          await copyTextToClipboard(data.promptForAgentHandoff || '');
          showToast('Copied handoff request to clipboard');
        } catch (err) {
          if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === convId) {
            cancelPendingSmartHandoff(false);
          }
          showToast('Error starting smart handoff: ' + err.message);
        }
      }

      async function handleStartNewChatFromHandoff(convId) {
        const promptText = readCurrentHandoffText(convId).trim();
        if (!promptText) {
          showToast('Handoff prompt is empty');
          return;
        }

        const card = state.conversations.find((c) => c.id === convId);
        const selectedModel = resolveSelectedModelEntry(card);
        try {
          await postAndActivateNewConversation(
            {
              message: promptText,
              conversationId: convId,
              projectId: (card && card.projectId) || '',
              workspacePath: (card && card.workspacePath) || '',
              model: (selectedModel && selectedModel.modelEnum) || (card && card.modelEnum) || '',
              modelId: (selectedModel && selectedModel.modelId) || ''
            },
            () => {
              state.openHandoffId = null;
              const hState = getHandoffState(convId);
              hState.step = 'focus';
              hState.text = '';
              hState.dismissedHandoffMs = Math.max(
                hState.dismissedHandoffMs || 0,
                hState.loadedHandoffMs || 0,
                (card && Number(card.latestHandoffMs)) || 0
              );
            }
          );
          showToast('Started new conversation with handoff!');
          return;
        } catch (chatErr) {
          console.warn('[AgyCockpit] startConversation failed, falling back to clipboard:', chatErr);
          await copyTextToClipboard(promptText);
          showToast('Could not start chat automatically; copied prompt to clipboard');

        }

      async function postAndActivateNewConversation(reqBody, onBeforeActivate) {
        const httpRes = await apiFetch('/_sidecar/new-conversation', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reqBody)
        });
        const res = await httpRes.json().catch(() => ({}));
        if (!httpRes.ok || (res && res.error)) {
          throw new Error((res && res.error) || 'Failed to start conversation');
        }
        const rawUuidMatch =
          res && typeof res.raw === 'string'
            ? /([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i.exec(res.raw)
            : null;
        const newConvId = (
          (res && (res.conversationId || res.conversation_id)) ||
          (res && res.response && (res.response.conversationId || res.response.conversation_id)) ||
          (rawUuidMatch ? rawUuidMatch[1] : '') ||
          ''
        ).trim().toLowerCase();

        if (typeof onBeforeActivate === 'function') {
          onBeforeActivate(newConvId);
        }

        if (newConvId) {
          state.selectedWorkspaceKey = '__auto__';
          if (!initialHostConvId) {
            state.hostConvId = newConvId;
            state.manualPinId = newConvId;
            state.manualPinTs = Date.now();
          }
          claimActiveConversation(newConvId);
          openConversationInHost(newConvId);
        } else if (!initialHostConvId) {
          state.manualPinId = '';
          state.manualPinTs = 0;
        }
        await fetchStatus(true);
        setTimeout(() => { if (!isIframeHidden()) fetchStatus(true); }, 800);
        setTimeout(() => { if (!isIframeHidden()) fetchStatus(true); }, 2200);
        return newConvId;
      }

      async function handleStartQuickNewChat() {
        const ta = document.getElementById('new-chat-textarea');
        if (ta) {
          state.newChatText = ta.value;
        }
        const promptText = (state.newChatText || '').trim();
        if (!promptText) {
          showToast('Write a message to start a conversation');
          if (ta) ta.focus();
          return;
        }
        if (state.newChatSending) return;
        state.newChatSending = true;

        const pinnedCard = state.conversations.find((c) => c.id === state.lastPinnedId) || null;
        const effectiveScope = resolveEffectiveWorkspaceScope(pinnedCard);
        const targetWs = resolveNewChatTargetWorkspace(effectiveScope, pinnedCard);
        const hasProjectTarget = Boolean(targetWs && (targetWs.projectId || targetWs.path));
        const isGeneral = state.newChatTargetKey === '__unscoped__' || !hasProjectTarget || Boolean(state.newChatGeneral);

        const selectedModel = resolveSelectedModelEntry(pinnedCard, state.newChatModelEnum);
        const preferredModelEnum =
          (selectedModel && selectedModel.modelEnum) ||
          state.newChatModelEnum ||
          (pinnedCard && pinnedCard.modelEnum) ||
          state.defaultModelEnum ||
          (state.availableModels[0] && state.availableModels[0].modelEnum) ||
          '';
        const preferredModelId = (selectedModel && selectedModel.modelId) || '';

        renderNewChatDrawer(effectiveScope, pinnedCard);

        try {
          await postAndActivateNewConversation(
            {
              message: promptText,
              general: isGeneral,
              conversationId: (pinnedCard && pinnedCard.id) || state.hostConvId || '',
              projectId: isGeneral ? '' : ((targetWs && targetWs.projectId) || ''),
              workspacePath: isGeneral ? '' : ((targetWs && targetWs.path) || ''),
              model: preferredModelEnum,
              modelId: preferredModelId
            },
            () => {
              state.newChatSending = false;
              state.newChatOpen = false;
              state.newChatText = '';
              state.newChatTargetKey = '';
              state.newChatModelEnum = '';
              state.newChatGeneral = false;
            }
          );
          showToast(isGeneral ? 'Started new general conversation!' : 'Started new conversation!');
        } catch (err) {
          state.newChatSending = false;

          showToast('Error starting conversation: ' + err.message);

        const card = state.conversations.find((c) => c.id === convId);

      function pickFallbackConversationAfterRemove(shouldExclude) {
        const matchFn = typeof shouldExclude === 'function'
          ? shouldExclude
          : (c) => c.id === shouldExclude;
        const remaining = state.conversations.filter(
          (c) => !c.isSubagent && !matchFn(c)
        );
        if (remaining.length === 0) return null;
        if (state.activeWorkspaceKey) {
          const sameWs = remaining.filter((c) => c.workspaceKey === state.activeWorkspaceKey);
          if (sameWs.length > 0) return sameWs[0];
        }
        return remaining[0];
      }

      async function evictPinnedConversationIfMatching(shouldExclude, delayMs = 0) {
        const matchFn = typeof shouldExclude === 'function'
          ? shouldExclude
          : (c) => c.id === shouldExclude;
        const isIdExcluded = (id) => {
          if (!id) return false;
          if (typeof shouldExclude === 'string') return id === shouldExclude;
          const card = state.conversations.find((c) => c.id === id);
          return Boolean(card && matchFn(card));
        };
        if (isIdExcluded(initialHostConvId)) {
          initialHostConvId = '';
        }
        if (
          isIdExcluded(state.lastPinnedId) ||
          isIdExcluded(state.hostConvId) ||
          isIdExcluded(state.manualPinId)
        ) {
          const fallback = pickFallbackConversationAfterRemove(matchFn);
          if (fallback) {
            state.hostConvId = fallback.id;
            state.manualPinId = fallback.id;
            state.manualPinTs = Date.now();
            openConversationInHost(fallback.id);
            if (delayMs > 0) {
              await new Promise((r) => setTimeout(r, delayMs));
            }
          } else {
            state.hostConvId = '';
            state.manualPinId = '';
            state.lastPinnedId = '';
          }
        }
      }

      async function handleRenameConversation(convId, newTitle) {

            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: convId, title: cleanTitle })
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to rename conversation');
          }
          closeModal();
          await fetchStatus(true);
          showToast(cleanTitle ? 'Renamed conversation' : 'Restored default title');
        } catch (err) {
          closeModal();
          showToast('Error: ' + err.message);
        }
      }

      function closeProjectContextMenu() {
        if (!ctxMenuEl) return;
        ctxMenuEl.style.display = 'none';
        ctxMenuEl.innerHTML = '';
      }

      function openProjectContextMenu(clientX, clientY, wsKey, wsName, projId) {
        if (!ctxMenuEl || !wsKey || wsKey === '__all__') return;
        state.openMenuConvId = null;
        const displayLabel = wsKey === '__unscoped__' ? 'No Project' : (wsName || 'Project');
        let html =
          '<button class="card-menu-item" data-action="ctx-new-chat" data-ws-key="' + escapeHtml(wsKey) + '">' +
            '<span>+ New chat in "' + escapeHtml(displayLabel) + '"</span>' +
          '</button>';
        if (projId && wsKey !== '__unscoped__') {
          html +=
            '<div class="ctx-menu-sep"></div>' +
            '<button class="card-menu-item" data-action="ctx-archive-project" data-project-id="' + escapeHtml(projId) + '" data-project-name="' + escapeHtml(wsName || '') + '" data-ws-key="' + escapeHtml(wsKey) + '">' +
              '<span>Archive "' + escapeHtml(displayLabel) + '"</span>' +
            '</button>';
        }
        ctxMenuEl.innerHTML = html;
        ctxMenuEl.style.display = 'flex';
        ctxMenuEl.style.left = '0px';
        ctxMenuEl.style.top = '0px';
        const rect = ctxMenuEl.getBoundingClientRect();
        const maxLeft = Math.max(6, window.innerWidth - rect.width - 6);
        const maxTop = Math.max(6, window.innerHeight - rect.height - 6);
        const left = Math.min(Math.max(6, clientX), maxLeft);
        const top = Math.min(Math.max(6, clientY), maxTop);
        ctxMenuEl.style.left = left + 'px';
        ctxMenuEl.style.top = top + 'px';
