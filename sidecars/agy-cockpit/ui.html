<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AGY Cockpit</title>
  <script src="/preload.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --background: #101010;
      --foreground: #ededed;
      --card: #1c1c1c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      font-size: 13.5px;
      line-height: 1.5;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .shell {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 14px 16px;
      font-size: 13.5px;
      line-height: 1.5;
    }

    .top-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 2px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #10b981;
    }

    .dot-sm {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      display: inline-block;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground, #ededed);
    }

    .brand-ws {
      font-size: 13px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .ghost-btn {
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 3px 8px;
      font-size: 12.5px;
      font-weight: 400;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }

    .ghost-btn:hover {
      color: var(--foreground, #ededed);
      border-color: var(--border, rgba(255, 255, 255, 0.09));
      background: var(--secondary, rgba(255, 255, 255, 0.04));
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .update-btn { display: inline-flex; align-items: center; gap: 5px; }
    .update-btn.has-update { color: var(--foreground, #ededed); }
    .update-btn:disabled { opacity: 0.55; cursor: default; }
    .update-dot {
      width: 6.5px;
      height: 6.5px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.55);
      flex-shrink: 0;
    }

    .quota-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      color: var(--muted-foreground, #888888);
      border: 1px solid transparent;
      border-radius: 5px;
      padding: 3px 6px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: color 0.12s, border-color 0.12s, background 0.12s;
    }

    .quota-pill:hover {
      color: var(--foreground, #ededed);
      border-color: var(--border, rgba(255, 255, 255, 0.09));
      background: var(--secondary, rgba(255, 255, 255, 0.04));
    }

    .quota-ring {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      transform: rotate(-90deg);
    }

    .quota-ring circle {
      fill: none;
      stroke-width: 2.2;
    }

    .quota-ring .quota-ring-track {
      stroke: var(--border, rgba(255, 255, 255, 0.14));
    }

    .modal-card.quota-modal-card {
      max-width: 380px;
    }

    .quota-groups {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .quota-group {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 9px 10px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 6px;
    }

    .quota-group.is-active {
      border-color: var(--border, rgba(255, 255, 255, 0.22));
    }

    .quota-group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .quota-group-name {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--foreground, #ededed);
    }

    .quota-group-badge {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted-foreground, #999999);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 999px;
      padding: 0 6px;
      white-space: nowrap;
    }

    .quota-group-pct {
      font-size: 12.5px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    .quota-bucket {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quota-bucket-row,
    .quota-bucket-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    .quota-bucket-row {
      font-size: 12px;
      color: var(--foreground, #ededed);
    }

    .quota-bucket-meta {
      font-size: 11px;
      color: var(--muted-foreground, #777777);
    }

    .quota-bar {
      height: 5px;
      border-radius: 999px;
      background: var(--secondary, rgba(255, 255, 255, 0.08));
      overflow: hidden;
    }

    .quota-bar-fill {
      height: 100%;
      border-radius: 999px;
    }

    .quota-footnote {
      font-size: 11px;
      color: var(--muted-foreground, #777777);
    }

    .active-card {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .active-card-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-slot:empty {
      display: none;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .tier-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13.5px;
    }

    .tier-fresh { color: #34d399; }
    .tier-warm { color: #facc15; }
    .tier-heavy { color: #fb923c; }
    .tier-polluted { color: #f87171; }

    .dot-fresh { background: #10b981; }
    .dot-warm { background: #eab308; }
    .dot-heavy { background: #f97316; }
    .dot-polluted { background: #ef4444; }

    .muted {
      color: var(--muted-foreground, #888888);
      font-size: 12.5px;
      font-weight: 400;
    }

    .drift-warn {
      color: #fb923c;
      font-size: 12.5px;
      font-weight: 400;
    }

    .meter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meter-group[data-action="open-context-modal"] {
      cursor: pointer;
      border-radius: 6px;
      padding: 5px 7px;
      margin: -5px -7px;
      transition: background 0.12s;
    }

    .meter-group[data-action="open-context-modal"]:hover {
      background: rgba(255, 255, 255, 0.035);
    }

    .meter-group[data-action="open-context-modal"]:hover .context-meter-val {
      color: #93c5fd;
      text-decoration: underline;
      text-decoration-color: rgba(147, 197, 253, 0.45);
      text-underline-offset: 2px;
    }

    .modal-card.ctx-modal-card {
      max-width: 400px;
      gap: 9px;
    }

    .ctx-modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .ctx-modal-title-wrap {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .ctx-modal-sub {
      font-size: 11.5px;
      color: var(--muted-foreground, #888888);
    }

    .ctx-modal-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--foreground, #ededed);
      background: var(--secondary, rgba(255, 255, 255, 0.07));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.13));
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ctx-modal-scroll {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 66vh;
      overflow-y: auto;
      padding-right: 2px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.16) transparent;
    }

    .ctx-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 6px;
    }

    .ctx-section-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted-foreground, #999999);
    }

    .ctx-split-bar {
      display: flex;
      height: 6px;
      border-radius: 999px;
      background: var(--secondary, rgba(255, 255, 255, 0.08));
      overflow: hidden;
      gap: 1px;
    }

    .ctx-split-seg {
      height: 100%;
      transition: width 0.2s ease;
    }

    .ctx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      min-width: 0;
    }

    .ctx-row-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .ctx-row-label {
      color: var(--foreground, #ededed);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .ctx-row-val {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11.5px;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ctx-row-sub {
      font-size: 11px;
      color: var(--muted-foreground, #777777);
      line-height: 1.35;
    }

    .ctx-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ctx-tool-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      font-weight: 500;
      color: #93c5fd;
      background: rgba(59, 130, 246, 0.14);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 4px;
      padding: 0 5px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .ctx-skill-badge {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 500;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.13);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 4px;
      padding: 1px 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 190px;
    }

    .ctx-compacted-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 2px;
    }

    .ctx-compacted-pill {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 10.5px;
      color: var(--muted-foreground, #888888);
      background: var(--secondary, rgba(255, 255, 255, 0.05));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 4px;
      padding: 1px 6px;
    }

    .ctx-cat-block {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ctx-cat-bar {
      height: 4px;
      border-radius: 999px;
      background: var(--secondary, rgba(255, 255, 255, 0.07));
      overflow: hidden;
    }

    .ctx-cat-bar-fill {
      height: 100%;
      border-radius: 999px;
      background: #60a5fa;
    }

    .ctx-rank {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      color: var(--muted-foreground, #777777);
      width: 18px;
      flex-shrink: 0;
    }

    .ctx-empty-note {
      font-size: 11.5px;
      color: var(--muted-foreground, #777777);
    }

    .meter-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 400;
    }

    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--foreground, #ededed);
    }

    .meter-track {
      width: 100%;
      height: 6px;
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      border-radius: 999px;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.2s ease;
    }

    .meter-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12.5px;
      font-weight: 400;
      color: var(--muted-foreground, #888888);
      flex-wrap: wrap;
    }

    .tokens-summary {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 7px;
      margin-top: 2px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.06));
    }

    .tokens-total-wrap { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .subagent-pill {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--secondary, rgba(255, 255, 255, 0.06)); color: var(--muted-foreground, #a0a0a0);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12)); border-radius: 999px;
      padding: 1px 8px; font: 500 11.5px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      cursor: pointer; transition: color 0.12s, background 0.12s, border-color 0.12s;
    }
    .subagent-pill:hover, .subagent-pill.active {
      color: var(--foreground, #ededed); background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.22);
    }
    .subagents-list { display: flex; flex-direction: column; gap: 4px; width: 100%; margin-top: 4px; }
    .subagent-row {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 5px 8px; background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.07)); border-radius: 6px;
      font-size: 12px; cursor: pointer; transition: background 0.12s, border-color 0.12s;
    }
    .subagent-row:hover { background: var(--secondary, rgba(255, 255, 255, 0.05)); border-color: rgba(255, 255, 255, 0.16); }
    .subagent-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
    .subagent-title { color: var(--foreground, #ededed); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .subagent-right { display: flex; align-items: center; gap: 5px; flex-shrink: 0; font-size: 11.5px; color: var(--muted-foreground, #888888); }
    .subagent-status-wait { color: #fbbf24; font-weight: 500; }

    .actions-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 9px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.08));
      flex-wrap: wrap;
    }

    .actions-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-solid,
    .btn-primary {
      background: var(--foreground, #ededed);
      color: var(--background, #0a0a0a);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.12s;
    }

    .btn-solid:hover,
    .btn-primary:hover {
      opacity: 0.88;
    }

    .btn-outline,
    .btn-secondary {
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.12));
      border-radius: 6px;
      padding: 5px 11px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-outline:hover,
    .btn-secondary:hover {
      background: var(--secondary, rgba(255, 255, 255, 0.06));
      border-color: rgba(255, 255, 255, 0.2);
    }

    .section-block {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border, rgba(255, 255, 255, 0.14));
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px;
      cursor: pointer;
      user-select: none;
      border-radius: 6px;
      transition: opacity 0.12s;
    }

    .section-header:hover {
      opacity: 0.9;
    }

    .section-header-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .section-chevron {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      font-size: 12px;
      color: var(--muted-foreground, #9a9a9a);
      transition: transform 0.15s ease, color 0.12s;
      flex-shrink: 0;
    }

    .section-header:hover .section-chevron {
      color: var(--foreground, #ededed);
    }

    .section-block.collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .section-block.collapsed .section-body {
      display: none;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--foreground, #ededed);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .section-badge {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted-foreground, #a0a0a0);
      background: var(--secondary, rgba(255, 255, 255, 0.06));
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 999px;
      padding: 1px 8px;
      flex-shrink: 0;
    }

    .section-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-card {
      background: var(--card, #141414);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.09));
      border-radius: 8px;
      padding: 11px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .filter-top-row {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      width: 100%;
      background: var(--background, #0a0a0a);
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.1));
      border-radius: 6px;
      padding: 7px 11px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.12s;
    }

    .search-input::placeholder {
      color: var(--muted-foreground, #777777);
    }

    .search-input:focus {
      border-color: var(--muted-foreground, #888888);
    }

    .btn-new-chat {
      background: var(--secondary, rgba(255, 255, 255, 0.07));
      color: var(--foreground, #ededed);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.14));
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12.5px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s, border-color 0.12s;
    }

    .btn-new-chat:hover,
    .btn-new-chat.active {
      background: rgba(59, 130, 246, 0.18);
      border-color: rgba(59, 130, 246, 0.5);
      color: #93c5fd;
    }

    .new-chat-drawer {
      background: var(--background, #0a0a0a);
      border: 1px solid var(--border, rgba(255, 255, 255, 0.11));
      border-radius: 7px;
      padding: 9px 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .new-chat-scope-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }

    .new-chat-textarea {
      width: 100%;
      min-height: 110px;

          <button class="quota-pill" id="quota-pill" data-action="open-quota-modal" style="display:none;"></button>
          <button class="ghost-btn update-btn" id="btn-update" title="Check for AGY Cockpit updates on GitHub">
            <span class="update-dot" id="update-dot" style="display:none;"></span>
            <span id="btn-update-label">Update</span>
          </button>
        </div>

      <div id="pinned-container"></div>
    </div>

    <div class="section-block" id="section-other">
      <div class="section-header" data-action="toggle-section" data-section="other">
        <div class="section-header-left">
          <span class="section-chevron">▾</span>
          <span class="section-title" id="list-header-title">Other conversations</span>
        </div>
        <span class="section-badge" id="list-header-count"></span>
      </div>
      <div class="section-body">
        <div class="filter-card">
          <div class="filter-top-row">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Filter conversations or prompts..."
            />
            <button class="btn-new-chat" id="btn-toggle-new-chat" data-action="toggle-new-chat" title="Start a new conversation">+ New</button>
          </div>
          <div id="new-chat-slot" class="card-slot"></div>
          <div class="scope-tabs" id="workspace-pills"></div>
        </div>
        <div id="cards-container" style="display:flex;flex-direction:column;gap:8px;"></div>

  </div>

  <div class="diag-sticky" id="diag-sticky" style="display:none;"></div>
  <div class="ctx-menu" id="ctx-menu" style="display:none;"></div>
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="toast" id="toast"></div>

  <script>
    (function() {
      let initialHostConvId = (
        (window.sidecar && window.sidecar.conversationId) ||
        new URLSearchParams(window.location.search).get('conversationId') ||
        (window.__SIDECAR_BOOT__ && window.__SIDECAR_BOOT__.conversationId) ||
        ''
      ).trim().toLowerCase();

      try {
        const cachedTheme = sessionStorage.getItem('__agy_cockpit_theme_vars__');
        if (cachedTheme) {
          const parsedVars = JSON.parse(cachedTheme);
          for (const [k, v] of Object.entries(parsedVars)) {
            document.documentElement.style.setProperty(k, v);
          }
        }
      } catch {}
      window.addEventListener('message', (ev) => {
        if (ev.data && ev.data.type === 'theme-change' && ev.data.payload && ev.data.payload.cssVariables) {
          try {
            sessionStorage.setItem('__agy_cockpit_theme_vars__', JSON.stringify(ev.data.payload.cssVariables));
          } catch {}
        }
      });

      const urlSimulateDiag = (new URLSearchParams(window.location.search).get('simulateDiag') || '').trim();
      let initialDismissedDiagSig = '';
      try {
        initialDismissedDiagSig = sessionStorage.getItem('__agy_cockpit_dismissed_diag_sig__') || '';
      } catch {}

      const state = {
        version: 0,
        uiMtimeMs: 0,
        hostConvId: initialHostConvId,
        lastPinnedId: '',
        manualPinId: '',
        manualPinTs: 0,
        detailsRevCounter: 0,
        scrollPositions: new Map(),
        workspaceUris: [],
        lastWorkspaceUrisJson: '[]',
        pollInFlight: false,
        lastPollDoneMs: 0,
        selectedWorkspaceKey: '__auto__',
        searchQuery: '',
        lastFetchedQuery: '',
        conversations: [],
        workspaces: [],
        archivedProjects: [],
        archivedConversations: [],
        availableModels: [],
        defaultModelEnum: '',
        quota: null,
        quotaActiveKey: '',
        quotaModalTimer: null,
        activeContextModalConvId: null,
        contextModalReqSeq: 0,
        contextModalData: null,
        contextModalLoading: false,
        contextModalError: '',
        contextModalLastSig: '',
        activeWorkspaceKey: '',
        searchMatches: null,
        diagnostics: null,
        diagExpanded: false,
        diagRechecking: false,
        dismissedDiagSig: initialDismissedDiagSig,
        pluginUpdate: null,
        pluginUpdating: false,
        expandedDetails: new Map(),
        expandedSubagents: new Set(),
        expandedPromptKeys: new Set(),
        openHandoffId: null,
        pendingSmartHandoff: null,
        handoffStateByConv: new Map(),
        openMenuConvId: null,
        newChatOpen: false,
        newChatText: '',
        newChatGeneral: false,
        newChatTargetKey: '',
        newChatModelEnum: '',
        newChatSending: false,
        prevThinkingById: new Map(),
        prevModelRespMsById: new Map(),
        prevUserInputMsById: new Map(),
        hasSeededUserInputMs: false,
        traceEnabled: false
      };

      const appShellEl = document.getElementById('app-shell');
      const diagStickyEl = document.getElementById('diag-sticky');
      const ctxMenuEl = document.getElementById('ctx-menu');
      const pinnedContainer = document.getElementById('pinned-container');
      const cardsContainer = document.getElementById('cards-container');
      const workspacePillsEl = document.getElementById('workspace-pills');
      const newChatSlotEl = document.getElementById('new-chat-slot');
      const btnToggleNewChatEl = document.getElementById('btn-toggle-new-chat');
      const searchInput = document.getElementById('search-input');
      const activeWsIndicator = document.getElementById('active-workspace-indicator');
      const listHeaderTitle = document.getElementById('list-header-title');
      const listHeaderCount = document.getElementById('list-header-count');
      const sectionOtherEl = document.getElementById('section-other');
      const statusDotEl = document.getElementById('status-dot');
      const btnUpdate = document.getElementById('btn-update');
      const updateDotEl = document.getElementById('update-dot');
      const btnUpdateLabelEl = document.getElementById('btn-update-label');
      const quotaPillEl = document.getElementById('quota-pill');
      const modalBackdropEl = document.getElementById('modal-backdrop');
      const toastEl = document.getElementById('toast');

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('visible');
        clearTimeout(showToast._timer);
        showToast._timer = setTimeout(() => {
          toastEl.classList.remove('visible');
        }, 2000);
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function highlightSearchText(rawText, rawQuery) {
        const str = String(rawText ?? '');
        const q = String(rawQuery ?? '').replace(/\s+/g, ' ').trim();
        if (!q || !str) return escapeHtml(str);
        const pattern = q
          .replace(/[.*+?^${}()|[\]\\]/g, '\\$&')
          .replace(/ /g, '\\s+');
        const re = new RegExp(pattern, 'gi');
        let pos = 0;
        let out = '';
        let m;
        while ((m = re.exec(str)) !== null) {
          const idx = m.index;
          const mLen = m[0].length;
          if (mLen === 0) {
            re.lastIndex += 1;
            continue;
          }
          if (idx > pos) {
            out += escapeHtml(str.slice(pos, idx));
          }
          out += '<mark class="search-mark">' + escapeHtml(m[0]) + '</mark>';
          pos = idx + mLen;
        }
        if (pos === 0) return escapeHtml(str);
        if (pos < str.length) {
          out += escapeHtml(str.slice(pos));
        }
        return out;
      }

      function formatRelativeTime(isoOrMs) {
        if (!isoOrMs) return '';
        const ms = typeof isoOrMs === 'number' ? isoOrMs : Date.parse(isoOrMs);
        if (!Number.isFinite(ms) || ms <= 0) return '';
        const diffSec = Math.max(0, Math.floor((Date.now() - ms) / 1000));
        if (diffSec < 45) return 'just now';
        const mins = Math.floor(diffSec / 60);
        if (mins < 60) return mins + 'm ago';
        const hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        const days = Math.floor(hours / 24);
        if (days < 30) return days + 'd ago';
        return Math.floor(days / 30) + 'mo ago';
      }

      function formatTokens(tok) {
        if (!tok || tok <= 0) return '0';
        if (tok >= 1000000) return (tok / 1000000).toFixed(2) + 'M';
        if (tok >= 1000) return (tok / 1000).toFixed(1) + 'k';
        return String(tok);
      }

      function formatBytes(bytes) {
        const b = Number(bytes) || 0;
        if (b <= 0) return '0 B';
        if (b >= 1024 * 1024) return (b / (1024 * 1024)).toFixed(2) + ' MB';
        if (b >= 1024) return (b / 1024).toFixed(1) + ' KB';
        return b + ' B';
      }

      async function copyTextToClipboard(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch {}
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        let ok = false;
        try {
          ok = document.execCommand('copy');
        } catch {}
        document.body.removeChild(ta);
        return ok;
      }

      function apiFetch(urlPath, options = {}) {
        if (window.sidecar && typeof window.sidecar.fetch === 'function') {
          return window.sidecar.fetch(urlPath, options);
        }
        return fetch(urlPath, options);
      }

      function openConversationInHost(convId) {
        if (window.sidecar && window.sidecar.ui && typeof window.sidecar.ui.toggleConversation === 'function') {
          window.sidecar.ui.toggleConversation(convId);
        }
      }

      function resolveEffectiveWorkspaceScope(activeCard) {
        if (state.selectedWorkspaceKey !== '__auto__') {
          return state.selectedWorkspaceKey;
        }
        if (
          activeCard &&
          activeCard.workspaceKey &&
          state.workspaces.some((w) => w.key === activeCard.workspaceKey)
        ) {
          return activeCard.workspaceKey;
        }
        if (activeCard && !activeCard.workspaceKey && activeCard.promptCount > 0) {
          if (state.workspaces.some((w) => w.key === '__unscoped__')) {
            return '__unscoped__';
          }
        }
        if (
          state.activeWorkspaceKey &&
          state.workspaces.some((w) => w.key === state.activeWorkspaceKey)
        ) {
          return state.activeWorkspaceKey;
        }
        return '__all__';
      }

      const TIER_UI = {
        fresh: { id: 'fresh', label: 'Fresh', text: 'tier-fresh', dot: 'dot-fresh', color: '#10b981' },
        warm: { id: 'warm', label: 'Warm', text: 'tier-warm', dot: 'dot-warm', color: '#eab308' },
        heavy: { id: 'heavy', label: 'Heavy', text: 'tier-heavy', dot: 'dot-heavy', color: '#f97316' },
        polluted: { id: 'polluted', label: 'Polluted', text: 'tier-polluted', dot: 'dot-polluted', color: '#ef4444' }
      };

      function getCardTier(card) {
        const id = (card && card.pollution && card.pollution.id) || 'fresh';
        return TIER_UI[id] || TIER_UI.fresh;
      }

      const QUOTA_FAMILY_PATTERNS = [
        { key: 'argon', re: /argon/i },
        { key: 'claude', re: /claude|anthropic|opus|sonnet|haiku/i },
        { key: 'gemini', re: /gemini|google/i, excludeRe: /argon/i },
        { key: 'openai', re: /openai|\bgpt|codex/i }
      ];

      function getQuotaColor(usedPct) {
        const pct = Number(usedPct) || 0;
        if (pct >= 90) return TIER_UI.polluted.color;
        if (pct >= 75) return TIER_UI.heavy.color;
        if (pct >= 50) return TIER_UI.warm.color;
        return TIER_UI.fresh.color;
      }

      function formatQuotaPct(pct) {
        return Math.round(Math.min(100, Math.max(0, Number(pct) || 0))) + '%';
      }

      function resolveCardQuotaFamily(card) {
        if (!card) return '';
        const model = card.modelEnum
          ? state.availableModels.find((m) => m.modelEnum === card.modelEnum)
          : null;
        const text = [card.modelLabel, model && model.label, model && model.modelId, card.modelEnum]
          .filter(Boolean)
          .join(' ');
        const hit = text ? QUOTA_FAMILY_PATTERNS.find((p) => p.re.test(text) && (!p.excludeRe || !p.excludeRe.test(text))) : null;
        return hit ? hit.key : '';
      }

      function resolveActiveQuota(pinnedCard) {
        const groups = state.quota ? state.quota.groups.filter((g) => g.maxUsedPct !== null) : [];
        if (groups.length === 0) return null;
        const family = resolveCardQuotaFamily(pinnedCard);
        const findGroup = (fam) => groups.find((g) => g.family === fam || (Array.isArray(g.families) && g.families.includes(fam)));
        const match = family ? findGroup(family) || (family === 'argon' ? findGroup('gemini') : null)
          : null;
        if (match) return { group: match, pct: match.maxUsedPct, matched: true };
        const top = groups.reduce((a, b) => (b.maxUsedPct > a.maxUsedPct ? b : a));
        return { group: top, pct: top.maxUsedPct, matched: false };
      }

      function renderQuotaPill(pinnedCard) {
        if (!quotaPillEl) return;
        const active = resolveActiveQuota(pinnedCard);
        if (!active) {
          state.quotaActiveKey = '';
          if (quotaPillEl.style.display !== 'none') {
            quotaPillEl.style.display = 'none';
            quotaPillEl.innerHTML = '';
          }
          return;
        }
        state.quotaActiveKey = active.matched ? active.group.key : '';
        const color = getQuotaColor(active.pct);
        const radius = 5.4;
        const circumference = 2 * Math.PI * radius;
        const filled = (Math.min(100, Math.max(0, active.pct)) / 100) * circumference;
        const html =
          '<svg class="quota-ring" viewBox="0 0 14 14" aria-hidden="true">' +
            '<circle class="quota-ring-track" cx="7" cy="7" r="' + radius + '"></circle>' +
            '<circle cx="7" cy="7" r="' + radius + '" stroke="' + color + '" stroke-linecap="round"' +
              ' stroke-dasharray="' + filled.toFixed(2) + ' ' + circumference.toFixed(2) + '"></circle>' +
          '</svg>' +
          '<span>' + formatQuotaPct(active.pct) + '</span>';
        if (quotaPillEl.innerHTML !== html) {
          quotaPillEl.innerHTML = html;
        }
        const bucketSummary = active.group.buckets
          .filter((b) => !b.disabled && b.usedPct !== null)
          .map((b) => b.windowLabel + ' ' + formatQuotaPct(b.usedPct) + ' used')
          .join(', ');
        const title = (active.matched ? '' : 'Highest usage · ') + active.group.label + ': ' + bucketSummary + ' · click for all models';
        if (quotaPillEl.title !== title) {
          quotaPillEl.title = title;
          quotaPillEl.setAttribute('aria-label', 'Model usage limits: ' + title);
        }
        if (quotaPillEl.style.display === 'none') {
          quotaPillEl.style.display = '';
        }
      }

      function formatQuotaReset(resetMs) {
        if (!resetMs) return '';
        const diffMs = resetMs - Date.now();
        if (diffMs <= 0) return 'resetting now';
        const totalMin = Math.ceil(diffMs / 60000);
        const days = Math.floor(totalMin / 1440);
        const hours = Math.floor((totalMin % 1440) / 60);
        const mins = totalMin % 60;
        if (days > 0) {
          const when = new Date(resetMs).toLocaleString(undefined, { weekday: 'short', hour: '2-digit', minute: '2-digit' });
          return 'resets in ' + days + 'd ' + hours + 'h (' + when + ')';
        }
        if (hours > 0) return 'resets in ' + hours + 'h ' + mins + 'm';
        return 'resets in ' + mins + 'm';
      }

      function renderQuotaBucket(bucket) {
        const tooltip = [bucket.label, bucket.description].filter(Boolean).join(' · ');
        const titleAttr = tooltip ? ' title="' + escapeHtml(tooltip) + '"' : '';
        const resetText = formatQuotaReset(bucket.resetMs);
        if (bucket.disabled) {
          return '<div class="quota-bucket"' + titleAttr + '>' +
            '<div class="quota-bucket-row"><span>' + escapeHtml(bucket.windowLabel) + '</span><span class="muted">Disabled</span></div>' +
          '</div>';
        }
        if (bucket.usedPct === null) {
          const amountText = bucket.remainingAmount !== null ? bucket.remainingAmount + ' left' : 'Unknown';
          return '<div class="quota-bucket"' + titleAttr + '>' +
            '<div class="quota-bucket-row"><span>' + escapeHtml(bucket.windowLabel) + '</span><span>' + escapeHtml(amountText) + '</span></div>' +
            (resetText ? '<div class="quota-bucket-meta"><span></span><span>' + escapeHtml(resetText) + '</span></div>' : '') +
          '</div>';
        }
        const color = getQuotaColor(bucket.usedPct);
        const width = Math.min(100, Math.max(0, bucket.usedPct));
        return '<div class="quota-bucket"' + titleAttr + '>' +
          '<div class="quota-bucket-row">' +
            '<span>' + escapeHtml(bucket.windowLabel) + '</span>' +
            '<span style="color:' + color + ';">' + formatQuotaPct(bucket.usedPct) + ' used</span>' +
          '</div>' +
          '<div class="quota-bar"><div class="quota-bar-fill" style="width:' + width.toFixed(1) + '%;background:' + color + ';"></div></div>' +
          '<div class="quota-bucket-meta">' +
            '<span>' + formatQuotaPct(bucket.remainingPct) + ' remaining</span>' +
            '<span>' + escapeHtml(resetText) + '</span>' +
          '</div>' +
        '</div>';
      }

      function renderQuotaModalHtml() {
        const quota = state.quota;
        let groupsHtml = '';
        if (!quota) {
          groupsHtml = '<div class="muted">No quota data reported by Antigravity.</div>';
        } else {
          for (const g of quota.groups) {
            const isActive = Boolean(state.quotaActiveKey) && g.key === state.quotaActiveKey;
            const pctHtml = g.maxUsedPct === null
              ? ''
              : '<span class="quota-group-pct" style="color:' + getQuotaColor(g.maxUsedPct) + ';" title="Bottleneck: highest usage across windows">' + formatQuotaPct(g.maxUsedPct) + '</span>';
            groupsHtml +=
              '<div class="quota-group' + (isActive ? ' is-active' : '') + '"' + (g.description ? ' title="' + escapeHtml(g.description) + '"' : '') + '>' +
                '<div class="quota-group-head">' +
                  '<span class="quota-group-name">' + escapeHtml(g.label) +
                    (isActive ? '<span class="quota-group-badge">Active chat</span>' : '') +
                  '</span>' +
                  pctHtml +
                '</div>' +
                g.buckets.map(renderQuotaBucket).join('') +
              '</div>';
          }
        }
        const notes = [];
        if (quota && quota.source === 'model_config') {
          notes.push('Per-model quota from the model catalog (window length not reported).');
        }
        if (quota && quota.fetchedAtMs) {
          notes.push('Updated ' + formatRelativeTime(quota.fetchedAtMs));
        }
        return '<div class="modal-card quota-modal-card" role="dialog" aria-modal="true">' +
            '<div class="modal-title">Model usage limits</div>' +
            '<div class="quota-groups">' + groupsHtml + '</div>' +
            (notes.length > 0 ? '<div class="quota-footnote">' + escapeHtml(notes.join(' · ')) + '</div>' : '') +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Close</button>' +
            '</div>' +
          '</div>';
      }

      function isQuotaModalOpen() {
        return Boolean(
          modalBackdropEl &&
          modalBackdropEl.classList.contains('open') &&
          modalBackdropEl.querySelector('.quota-modal-card')
        );
      }

      function refreshQuotaModal() {
        if (!isQuotaModalOpen()) return;
        const groupsEl = modalBackdropEl.querySelector('.quota-groups');
        const scrollTop = groupsEl ? groupsEl.scrollTop : 0;
        const html = renderQuotaModalHtml();
        if (modalBackdropEl.innerHTML !== html) {
          modalBackdropEl.innerHTML = html;
          const nextGroupsEl = modalBackdropEl.querySelector('.quota-groups');
          if (nextGroupsEl) nextGroupsEl.scrollTop = scrollTop;
        }
      }

      function stopQuotaModalTimer() {
        if (state.quotaModalTimer) {
          clearInterval(state.quotaModalTimer);
          state.quotaModalTimer = null;
        }
      }

      async function openQuotaModal() {
        if (!modalBackdropEl) return;
        state.activeContextModalConvId = null;
        state.contextModalReqSeq += 1;
        modalBackdropEl.innerHTML = renderQuotaModalHtml();
        modalBackdropEl.classList.add('open');
        stopQuotaModalTimer();
        state.quotaModalTimer = setInterval(() => {
          if (!isQuotaModalOpen()) {
            stopQuotaModalTimer();
            return;
          }
          refreshQuotaModal();
        }, 30000);
        try {
          const res = await apiFetch('/api/quota?refresh=1');
          if (!res.ok) return;
          const data = await res.json();
          if (data && data.quota && Array.isArray(data.quota.groups) && data.quota.groups.length > 0) {
            state.quota = data.quota;
            renderAll();
          }
        } catch {}
      }

      function isContextBreakdownModalOpen() {
        return Boolean(
          modalBackdropEl &&
          modalBackdropEl.classList.contains('open') &&
          state.activeContextModalConvId &&
          modalBackdropEl.querySelector('.ctx-modal-card')
        );
      }

      function renderContextBreakdownModalHtml(convId) {
        const card = state.conversations.find((c) => c.id === convId) || null;
        const data = state.contextModalData && state.contextModalData.id === convId
          ? state.contextModalData
          : null;

        if (!data) {
          const bodyMsg = state.contextModalError
            ? '<div class="ctx-empty-note" style="color:#f87171;">' + escapeHtml(state.contextModalError) + '</div>'
            : '<div class="ctx-empty-note">Analyzing active context window...</div>';
          return (
            '<div class="modal-card ctx-modal-card" role="dialog" aria-modal="true">' +
              '<div class="ctx-modal-head">' +
                '<div class="ctx-modal-title-wrap">' +
                  '<div class="modal-title">Context Window Breakdown</div>' +
                '</div>' +
              '</div>' +
              '<div class="ctx-section">' + bodyMsg + '</div>' +
              '<div class="modal-actions">' +
                '<button class="btn-secondary" data-action="close-modal">Close</button>' +
              '</div>' +
            '</div>'
          );
        }

        const curTok = Number(data.currentTokens) || (card && Number(card.currentTokens)) || 0;
        const ceilTok = Number(data.observedCeiling) || (card && Number(card.observedCeiling)) || 0;
        const ceilExceeded = Boolean(data.ceilingExceeded || (ceilTok > 0 && curTok > ceilTok));
        const fillPct = ceilTok > 0 && !ceilExceeded
          ? Math.min(100, Math.round((curTok / ceilTok) * 100))
          : 0;
        const pillText = ceilTok > 0 && !ceilExceeded
          ? formatTokens(curTok) + ' / ~' + formatTokens(ceilTok) + ' (' + fillPct + '%)'
          : formatTokens(curTok) + ' tok';

        const compactCount = Number(data.compactCount) || 0;
        const activePrompts = Number(data.activePromptsCount) || 0;
        const subText = compactCount > 0
          ? 'Active window after Compact #' + compactCount + ' · ' + activePrompts + ' prompt' + (activePrompts === 1 ? '' : 's')
          : 'Active window (no compactions) · ' + activePrompts + ' prompt' + (activePrompts === 1 ? '' : 's');

        const baseTok = Number(data.baseTokens) || 0;
        const growthTok = Number(data.activeGrowthTokens) || 0;
        const cachedSysTok = Number(data.cachedSystemPrefixTokens) || 0;
        const denomTok = Math.max(curTok, baseTok + growthTok, 1);
        const basePct = curTok > 0 ? Math.min(100, Math.max(4, Math.round((baseTok / denomTok) * 100))) : 0;
        const growthPct = curTok > 0 ? Math.max(0, 100 - basePct) : 0;

        const baseLabel = compactCount > 0
          ? 'Base + Compaction Summary'
          : 'System & Rules / Initial Base';

        let baseSubNote = '';
        if (cachedSysTok > 0) {
          if (compactCount > 0 && baseTok > cachedSysTok) {
            baseSubNote =
              'Cached system prefix: ' + formatTokens(cachedSysTok) + ' tok · Summary & init: ~' +
              formatTokens(Math.max(0, baseTok - cachedSysTok)) + ' tok';
          } else {
            baseSubNote = 'Cached system & tools prefix: ' + formatTokens(cachedSysTok) + ' tok';
          }
        } else if (compactCount > 0 && data.checkpointSummaryBytes > 0) {
          baseSubNote = 'Compaction summary payload: ' + formatBytes(data.checkpointSummaryBytes) + ' (~' + formatTokens(data.checkpointSummaryEstTokens) + ' tok)';
        }

        const activeToolCalls = Number(data.activeToolCallsCount) || 0;
        const growthSubNote =
          activePrompts + ' prompt' + (activePrompts === 1 ? '' : 's') + ' · ' +
          activeToolCalls + ' tool call' + (activeToolCalls === 1 ? '' : 's') +
          ' since ' + (compactCount > 0 ? 'last compact' : 'conversation start');

        const activeSkills = Array.isArray(data.activeSkills) ? data.activeSkills : [];
        const compactedSkills = Array.isArray(data.compactedSkills) ? data.compactedSkills : [];
        let skillsHtml = '';
        if (activeSkills.length === 0 && compactedSkills.length === 0) {
          skillsHtml = '<div class="ctx-empty-note">No skills loaded in this conversation.</div>';
        } else {
          if (activeSkills.length > 0) {
            for (const s of activeSkills) {
              const filesInfo = Array.isArray(s.files) && s.files.length > 0 ? s.files.join(', ') : 'SKILL.md';
              const metaNote = s.count > 1 ? s.count + ' reads' : filesInfo;
              skillsHtml +=
                '<div class="ctx-row" title="' + escapeHtml(s.name + ' (' + filesInfo + ')') + '">' +
                  '<div class="ctx-row-left">' +
                    '<span class="ctx-skill-badge">' + escapeHtml(s.name) + '</span>' +
                    '<span class="ctx-row-sub">' + escapeHtml(metaNote) + '</span>' +
                  '</div>' +
                  '<span class="ctx-row-val">' + escapeHtml(formatBytes(s.bytes) + ' (~' + formatTokens(s.estTokens) + ' tok)') + '</span>' +
                '</div>';
            }
          } else {
            skillsHtml += '<div class="ctx-empty-note">No skills read in the active window.</div>';
          }
          if (compactedSkills.length > 0) {
            skillsHtml +=
              '<div class="ctx-row-sub" style="margin-top:2px;">Before last compact (compacted):</div>' +
              '<div class="ctx-compacted-pills">' +
                compactedSkills.map((s) =>
                  '<span class="ctx-compacted-pill" title="Loaded before last compaction">' +
                    escapeHtml(s.name + ' · ' + formatBytes(s.bytes)) +
                  '</span>'
                ).join('') +
              '</div>';
          }
        }

        const categories = Array.isArray(data.categories) ? data.categories : [];
        const maxCatBytes = categories.reduce((acc, c) => Math.max(acc, Number(c.bytes) || 0), 0);
        let categoriesHtml = '';
        for (const cat of categories) {
          const catBytes = Number(cat.bytes) || 0;
          const catCount = Number(cat.count) || 0;
          const barWidth = maxCatBytes > 0 && catBytes > 0
            ? Math.max(4, Math.round((catBytes / maxCatBytes) * 100))
            : 0;
          const valStr = catBytes > 0
            ? formatBytes(catBytes) + ' · ~' + formatTokens(cat.estTokens) + ' tok'
            : '0 B';
          categoriesHtml +=
            '<div class="ctx-cat-block">' +
              '<div class="ctx-row">' +
                '<div class="ctx-row-left">' +
                  '<span class="ctx-row-label">' + escapeHtml(cat.label) + '</span>' +
                  '<span class="ctx-row-sub">(' + catCount + ')</span>' +
                '</div>' +
                '<span class="ctx-row-val">' + escapeHtml(valStr) + '</span>' +
              '</div>' +
              '<div class="ctx-cat-bar">' +
                '<div class="ctx-cat-bar-fill" style="width:' + barWidth + '%;"></div>' +
              '</div>' +
            '</div>';
        }

        const heaviestSteps = Array.isArray(data.heaviestSteps) ? data.heaviestSteps : [];
        let heaviestHtml = '';
        if (heaviestSteps.length === 0) {
          heaviestHtml = '<div class="ctx-empty-note">No tool activity in the active window yet.</div>';
        } else {
          for (let i = 0; i < heaviestSteps.length; i++) {
            const st = heaviestSteps[i];
            const tip = st.tool + ': ' + st.target + ' (' + formatBytes(st.bytes) + ')';
            heaviestHtml +=
              '<div class="ctx-row" title="' + escapeHtml(tip) + '">' +
                '<div class="ctx-row-left">' +
                  '<span class="ctx-rank">#' + (i + 1) + '</span>' +
                  '<span class="ctx-tool-badge">' + escapeHtml(st.tool) + '</span>' +
                  '<span class="ctx-row-label">' + escapeHtml(st.target) + '</span>' +
                '</div>' +
                '<span class="ctx-row-val">' + escapeHtml(formatBytes(st.bytes)) + '</span>' +
              '</div>';
          }
        }

        const topFiles = Array.isArray(data.topFiles) ? data.topFiles : [];
        let topFilesSectionHtml = '';
        if (topFiles.length > 0) {
          let filesRows = '';
          for (const f of topFiles) {
            const countsParts = [];
            if (f.readCount > 0) countsParts.push(f.readCount + 'r');
            if (f.editCount > 0) countsParts.push(f.editCount + 'w');
            filesRows +=
              '<div class="ctx-row" title="' + escapeHtml(f.path) + '">' +
                '<div class="ctx-row-left">' +
                  '<span class="ctx-row-label mono" style="font-size:11.5px;">' + escapeHtml(f.label) + '</span>' +
                  '<span class="ctx-row-sub">(' + escapeHtml(countsParts.join(' · ')) + ')</span>' +
                '</div>' +
                '<span class="ctx-row-val">' + escapeHtml(formatBytes(f.bytes)) + '</span>' +
              '</div>';
          }
          topFilesSectionHtml =
            '<div class="ctx-section">' +
              '<div class="ctx-section-title">Most Touched Files (Active Window)</div>' +
              filesRows +
            '</div>';
        }

        return (
          '<div class="modal-card ctx-modal-card" role="dialog" aria-modal="true">' +
            '<div class="ctx-modal-head">' +
              '<div class="ctx-modal-title-wrap">' +
                '<div class="modal-title">Context Window Breakdown</div>' +
                '<div class="ctx-modal-sub">' + escapeHtml(subText) + '</div>' +
              '</div>' +
              '<span class="ctx-modal-pill">' + escapeHtml(pillText) + '</span>' +
            '</div>' +
            '<div class="ctx-modal-scroll" data-scroll-key="ctx-modal-scroll">' +
              '<div class="ctx-section">' +
                '<div class="ctx-section-title">1. Base vs Active Turn Growth</div>' +
                '<div class="ctx-split-bar">' +
                  '<div class="ctx-split-seg" style="width:' + basePct + '%;background:#3b82f6;"></div>' +
                  '<div class="ctx-split-seg" style="width:' + growthPct + '%;background:#10b981;"></div>' +
                '</div>' +
                '<div class="ctx-row">' +
                  '<div class="ctx-row-left">' +
                    '<span class="ctx-dot" style="background:#3b82f6;"></span>' +
                    '<span class="ctx-row-label">' + escapeHtml(baseLabel) + '</span>' +
                  '</div>' +
                  '<span class="ctx-row-val">' + escapeHtml(formatTokens(baseTok) + ' tok') + '</span>' +
                '</div>' +
                (baseSubNote ? '<div class="ctx-row-sub">' + escapeHtml(baseSubNote) + '</div>' : '') +
                '<div class="ctx-row">' +
                  '<div class="ctx-row-left">' +
                    '<span class="ctx-dot" style="background:#10b981;"></span>' +
                    '<span class="ctx-row-label">Active Conversation Growth</span>' +
                  '</div>' +
                  '<span class="ctx-row-val">+' + escapeHtml(formatTokens(growthTok) + ' tok') + '</span>' +
                '</div>' +
                '<div class="ctx-row-sub">' + escapeHtml(growthSubNote) + '</div>' +
              '</div>' +

              '<div class="ctx-section">' +
                '<div class="ctx-section-title">2. Loaded Skills</div>' +
                skillsHtml +
              '</div>' +

              '<div class="ctx-section">' +
                '<div class="ctx-section-title">3. Tool Activity (Active Window)</div>' +
                categoriesHtml +
              '</div>' +

              '<div class="ctx-section">' +
                '<div class="ctx-section-title">4. Top 5 Heaviest Steps</div>' +
                heaviestHtml +
              '</div>' +

              topFilesSectionHtml +
            '</div>' +
            '<div class="modal-actions">' +
              '<button class="btn-secondary" data-action="close-modal">Close</button>' +
            '</div>' +
          '</div>'
        );
      }

      function refreshContextBreakdownModal() {
        if (!isContextBreakdownModalOpen()) return;
        const convId = state.activeContextModalConvId;
        const scrollEl = modalBackdropEl.querySelector('.ctx-modal-scroll');
        const scrollTop = scrollEl ? scrollEl.scrollTop : 0;
        const html = renderContextBreakdownModalHtml(convId);
        if (modalBackdropEl.innerHTML !== html) {
          modalBackdropEl.innerHTML = html;
          const nextScrollEl = modalBackdropEl.querySelector('.ctx-modal-scroll');
          if (nextScrollEl) nextScrollEl.scrollTop = scrollTop;
        }
      }

      async function fetchContextBreakdownForModal(convId) {
        if (!convId) return;
        state.contextModalReqSeq += 1;
        const reqSeq = state.contextModalReqSeq;
        try {
          const res = await apiFetch('/api/context-breakdown?id=' + encodeURIComponent(convId));
          if (
            reqSeq !== state.contextModalReqSeq ||
            state.activeContextModalConvId !== convId ||
            !modalBackdropEl ||
            !modalBackdropEl.classList.contains('open')
          ) {
            return;
          }
          const data = await res.json().catch(() => ({}));
          if (!res.ok || data.error) {
            throw new Error(data.error || 'Failed to load context breakdown');
          }
          state.contextModalData = data;
          state.contextModalLoading = false;
          state.contextModalError = '';
          const card = state.conversations.find((c) => c.id === convId);
          state.contextModalLastSig = card
            ? [card.id, card.currentTokens, card.compactCount, card.promptCount, card.totalTokens].join(':')
            : '';
          refreshContextBreakdownModal();
        } catch (err) {
          if (
            reqSeq !== state.contextModalReqSeq ||
            state.activeContextModalConvId !== convId ||
            !modalBackdropEl ||
            !modalBackdropEl.classList.contains('open')
          ) {
            return;
          }
          state.contextModalLoading = false;
          state.contextModalError = err && err.message ? err.message : 'Failed to load context breakdown';
          refreshContextBreakdownModal();
        }
      }

      function openContextBreakdownModal(convId) {
        if (!modalBackdropEl || !convId) return;
        stopQuotaModalTimer();
        state.openMenuConvId = null;
        state.activeContextModalConvId = convId;
        state.contextModalError = '';
        if (!state.contextModalData || state.contextModalData.id !== convId) {
          state.contextModalData = null;
          state.contextModalLoading = true;
        }
        modalBackdropEl.innerHTML = renderContextBreakdownModalHtml(convId);
        modalBackdropEl.classList.add('open');
        void fetchContextBreakdownForModal(convId);
      }

      function refreshContextBreakdownModalOnPoll() {
        if (!isContextBreakdownModalOpen()) return;
        const convId = state.activeContextModalConvId;
        const card = state.conversations.find((c) => c.id === convId);
        if (!card) return;
        const nextSig = [card.id, card.currentTokens, card.compactCount, card.promptCount, card.totalTokens].join(':');
        if (nextSig !== state.contextModalLastSig) {
          state.contextModalLastSig = nextSig;
          void fetchContextBreakdownForModal(convId);
        } else {
          refreshContextBreakdownModal();
        }
      }

      document.addEventListener('scroll', (e) => {
        const el = e.target;
        if (el && el.getAttribute) {
          const key = el.getAttribute('data-scroll-key');
          if (key) {
            state.scrollPositions.set(key, el.scrollTop);
          }
        }
      }, true);

      function restoreScrollPositions(rootEl) {
        if (!rootEl || !rootEl.querySelectorAll) return;
        const scrollables = rootEl.querySelectorAll('[data-scroll-key]');
        for (const el of scrollables) {
          const key = el.getAttribute('data-scroll-key');
          if (key && state.scrollPositions.has(key)) {
            el.scrollTop = state.scrollPositions.get(key);
          }
        }
      }

      function renderDetailsDrawer(card) {
        const details = state.expandedDetails.get(card.id);
        if (!details) return '';
        if (details.loading) {
          return '<div class="drawer"><span class="muted">Loading history...</span></div>';
        }

        let html = '<div class="drawer">';

        const prompts = Array.isArray(details.prompts) ? details.prompts : [];
        html += '<div class="drawer-subtitle">User prompts (' + prompts.length + ')</div>';
        if (prompts.length === 0) {
          html += '<div class="muted">No user prompts recorded.</div>';
        } else {
          html += '<div class="prompts-scroll" data-scroll-key="' + escapeHtml(card.id + ':prompts') + '">';
          for (const p of prompts) {
            const needsExpand = (p.text || '').length > 160 || (p.text || '').split('\n').length > 3;
            const pKey = card.id + ':' + p.index;
            const pExpanded = state.expandedPromptKeys.has(pKey);
            html +=
              '<div class="prompt-item">' +
                '<div class="prompt-item-head">' +
                  '<span>#' + p.index + '</span>' +
                  '<span>' + escapeHtml(formatRelativeTime(p.createdAt)) + '</span>' +
                '</div>' +
                '<div class="prompt-item-text' + (pExpanded ? ' expanded' : '') + '" data-scroll-key="' + escapeHtml(pKey) + '">' + escapeHtml(p.text) + '</div>' +
                (needsExpand
                  ? '<button class="expand-link" data-action="toggle-clamp" data-expand-key="' + escapeHtml(pKey) + '">' +
                      (pExpanded ? 'Show less' : 'Show more') +
                    '</button>'
                  : '') +
              '</div>';
          }
          html += '</div>';
        }

        if (details.checkpointOverview) {
          const ovKey = card.id + ':overview';
          const ovExpanded = state.expandedPromptKeys.has(ovKey);
          html +=
            '<div class="drawer-subtitle">Latest compact overview</div>' +
            '<div class="prompt-item">' +
              '<div class="prompt-item-text' + (ovExpanded ? ' expanded' : '') + '" data-scroll-key="' + escapeHtml(ovKey) + '">' +
                escapeHtml(details.checkpointOverview) +
              '</div>' +
              '<button class="expand-link" data-action="toggle-clamp" data-expand-key="' + escapeHtml(ovKey) + '">' +
                (ovExpanded ? 'Show less' : 'Show more') +
              '</button>' +
            '</div>';
        }

        if (Array.isArray(details.missedCommits) && details.missedCommits.length > 0) {
          html += '<div class="drawer-subtitle">Missed commits (' + details.commitsBehind + ' behind HEAD)</div>';
          html += '<div class="commits-list" data-scroll-key="' + escapeHtml(card.id + ':commits') + '">';
          for (const c of details.missedCommits) {
            html +=
              '<div class="commit-row">' +
                '<span class="commit-sha">' + escapeHtml(c.short) + '</span>' +
                '<span class="commit-subj">' + escapeHtml(c.subject) + '</span>' +
                '<span class="muted">' + escapeHtml(formatRelativeTime(c.tsMs || c.iso)) + '</span>' +
              '</div>';
          }
          html += '</div>';
        }

        html += '</div>';
        return html;
      }

      function getHandoffState(convId) {
        let st = state.handoffStateByConv.get(convId);
        if (!st) {
          st = {
            step: 'focus',
            text: '',
            selectedModelEnum: null,
            loadedHandoffMs: 0,
            dismissedHandoffMs: 0,
            cancelledPending: false
          };
          state.handoffStateByConv.set(convId, st);
        }
        return st;
      }

      function syncConversationHandoffState(conv) {
        if (!conv || !conv.id) return false;
        if (state.pendingSmartHandoff && state.pendingSmartHandoff.convId === conv.id) {
          return false;
        }
        const promptText = (conv.latestHandoffPrompt || '').trim();
        const handoffMs = Number(conv.latestHandoffMs) || 0;
        if (!promptText || handoffMs <= 0) return false;

        const hState = getHandoffState(conv.id);
        if (hState.cancelledPending) {
          hState.dismissedHandoffMs = Math.max(hState.dismissedHandoffMs || 0, handoffMs);
          return false;
        }
        const baselineMs = Math.max(hState.loadedHandoffMs || 0, hState.dismissedHandoffMs || 0);
        if (handoffMs <= baselineMs) return false;

        hState.text = promptText;
        hState.step = 'ready';
        hState.loadedHandoffMs = handoffMs;
        state.scrollPositions.set(conv.id + ':handoff', 0);
        return true;
      }

      function syncAllHandoffStates() {
        if (!Array.isArray(state.conversations)) return;
        for (const conv of state.conversations) {
          syncConversationHandoffState(conv);
        }
      }

      function parseLabelFamilyAndTier(label) {
        const clean = (label || '').trim();
        const m = /^(.+?)\s*\(([^()]+)\)$/.exec(clean);
        if (m) {
          return { family: m[1].trim(), tier: m[2].trim() };
        }
        return { family: clean || 'Default Model', tier: '' };
      }

      function getEffectiveModelsForCard(card) {
        const list = Array.isArray(state.availableModels) ? state.availableModels.slice() : [];
        if (card && card.modelEnum) {
          const exists = list.some((m) => m.modelEnum === card.modelEnum);
          if (!exists) {
            const label = card.modelLabel || card.modelEnum;
            const parsed = parseLabelFamilyAndTier(label);
            list.unshift({
              modelEnum: card.modelEnum,
              modelId: '',
              label,
              family: parsed.family,
              tier: parsed.tier
            });
          }
        }
        return list;
      }

      function groupModelsByFamily(card) {
        const list = getEffectiveModelsForCard(card);
        const byFamily = new Map();
        const groups = [];
        for (const m of list) {
          const fam = m.family || m.label || m.modelEnum;
          let g = byFamily.get(fam);
          if (!g) {
            g = { family: fam, models: [] };
            byFamily.set(fam, g);
            groups.push(g);
          }
          g.models.push(m);
        }
        return groups;
      }

      function resolveSelectedModelEntry(card, explicitModelEnum) {
        const hState = card && explicitModelEnum === undefined ? getHandoffState(card.id) : null;
        const list = getEffectiveModelsForCard(card);
        const wantedEnum =
          explicitModelEnum ||
          (hState && hState.selectedModelEnum) ||
          (card && card.modelEnum) ||
          state.defaultModelEnum ||
          (list[0] && list[0].modelEnum) ||
          '';
        if (!wantedEnum) return null;
        const found = list.find((m) => m.modelEnum === wantedEnum);
        if (found) return found;
        return list[0] || null;
      }

      function getModelSyncKey(card) {
        if (!card) return '';
        const hState = state.handoffStateByConv.get(card.id);
        const sel = (hState && hState.selectedModelEnum) || '';
        const catKey = Array.isArray(state.availableModels)
          ? state.availableModels.map((m) => m.modelEnum).join(',')
          : '';
        return [catKey, state.defaultModelEnum || '', card.modelEnum || '', card.modelLabel || '', sel].join('|');
      }

      function getNewChatModelSyncKey(card) {
        const sel = state.newChatModelEnum || '';
        const catKey = Array.isArray(state.availableModels)
          ? state.availableModels.map((m) => m.modelEnum).join(',')
          : '';
        return [
          catKey,
          state.defaultModelEnum || '',
          (card && card.modelEnum) || '',
          (card && card.modelLabel) || '',
          sel,
          state.newChatSending ? 'sending' : 'idle'
        ].join('|');
      }

      function renderModelBarControlsInner(card, convIdAttr, explicitModelEnum, isDisabled) {
        const groups = groupModelsByFamily(card);
        const selected = resolveSelectedModelEntry(card, explicitModelEnum);
        if (groups.length === 0 || !selected) {
          return '<span class="handoff-model-label">Model: detecting available models...</span>';
        }
        const idEsc = escapeHtml(convIdAttr);
        const disabledAttr = isDisabled ? ' disabled' : '';
        const selectedGroup = groups.find((g) => g.family === selected.family) || groups[0];
        let familyOpts = '';
        for (const g of groups) {
          const isSel = g.family === selectedGroup.family ? ' selected' : '';
          familyOpts +=
            '<option value="' + escapeHtml(g.family) + '"' + isSel + '>' +
              escapeHtml(g.family) +
            '</option>';
        }

        let html =
          '<div class="handoff-model-group">' +
            '<span class="handoff-model-label">Model</span>' +
            '<select class="handoff-select handoff-family-select" data-conv-id="' + idEsc + '"' + disabledAttr + '>' +
              familyOpts +
            '</select>' +
          '</div>';

        const hasTiers =
          selectedGroup.models.length > 1 ||
          Boolean(selectedGroup.models[0] && selectedGroup.models[0].tier);
        if (hasTiers) {
          let tierOpts = '';
          for (const m of selectedGroup.models) {
            const tierLabel = m.tier || 'Default';
            const isSel = m.modelEnum === selected.modelEnum ? ' selected' : '';
            tierOpts +=
              '<option value="' + escapeHtml(m.modelEnum) + '"' + isSel + '>' +
                escapeHtml(tierLabel) +
              '</option>';
          }
          html +=
            '<div class="handoff-model-group">' +
              '<span class="handoff-model-label">Thinking</span>' +
              '<select class="handoff-select handoff-tier-select" data-conv-id="' + idEsc + '"' + disabledAttr + '>' +
                tierOpts +
              '</select>' +
            '</div>';
        }
        return html;
      }

      function renderHandoffModelBarInner(card) {
        return renderModelBarControlsInner(card, card ? card.id : '', undefined, false);
      }

      function renderNewChatModelBarInner(card) {
        return renderModelBarControlsInner(card, '__new_chat__', state.newChatModelEnum, Boolean(state.newChatSending));
      }

      function renderHandoffDrawer(card) {
        if (state.openHandoffId !== card.id) return '';
        const isPending = Boolean(state.pendingSmartHandoff && state.pendingSmartHandoff.convId === card.id);

        const hState = getHandoffState(card.id);
        const idEsc = escapeHtml(card.id);
        let subtitleHtml = '';
        let placeholder = 'Optional instructions or focus for the AI handoff prompt (leave empty for full task handoff)...';
        let rows = 6;
        let readonlyAttr = '';
        let buttonsHtml =
          '<button class="btn-solid" data-action="handoff-smart-run" data-id="' + idEsc + '">' +
            'Generate Handoff Prompt' +
          '</button>';

        if (isPending) {
          subtitleHtml =
            '<div class="drawer-subtitle" style="color:var(--foreground, #ededed);">' +
              'Agent is generating AI handoff prompt...' +
            '</div>';
          placeholder = 'Waiting for AI handoff prompt...';
          readonlyAttr = ' disabled readonly aria-busy="true"';
          buttonsHtml =
            '<button class="btn-solid" disabled>Generating...</button>' +
            '<button class="ghost-btn" data-action="cancel-pending-handoff" data-id="' + idEsc + '">' +
              'Cancel' +
            '</button>';
        } else if (hState.step === 'ready') {
          subtitleHtml =
            '<div class="drawer-subtitle" style="color:#34d399;">' +
              'Review and edit AI handoff prompt before starting new chat' +
            '</div>';
          placeholder = 'Handoff prompt for the new conversation...';
          rows = 8;
          buttonsHtml =
            '<button class="btn-solid" data-action="handoff-start-chat" data-id="' + idEsc + '">' +
              'Start New Chat' +
            '</button>' +
            '<button class="btn-outline" data-action="handoff-copy" data-id="' + idEsc + '">' +
              'Copy' +
            '</button>';
        }

        const modelBarHtml =
          '<div class="handoff-model-bar" data-model-sync-key="' + escapeHtml(getModelSyncKey(card)) + '">' +
            renderHandoffModelBarInner(card) +
          '</div>';

        return (
          '<div class="drawer">' +
            subtitleHtml +
            '<textarea ' +
              'class="handoff-input" ' +
              'data-focus-conv="' + idEsc + '" ' +
              'data-scroll-key="' + escapeHtml(card.id + ':handoff') + '" ' +
              'placeholder="' + placeholder + '" ' +
              'rows="' + rows + '"' +
              readonlyAttr + '>' +
              escapeHtml(hState.text) +
            '</textarea>' +
            modelBarHtml +
            '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">' +
              buttonsHtml +
            '</div>' +
          '</div>'
        );
      }

      const PIN_ICON_SVG =
        '<svg class="pin-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" title="Pinned to top" aria-label="Pinned"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>';

      function renderStatusBadge(item, includeUnread) {
        if (item.waitState === 'permission' || item.waitState === 'question') {
          const isQ = item.waitState === 'question';
          const baseTip = isQ ? 'Waiting for your answer' : 'Waiting for permission approval';
          const tip = item.waitToolName ? baseTip + ' (' + item.waitToolName + ')' : baseTip;
          return '<span class="wait-badge" title="' + escapeHtml(tip) + '">' + (isQ ? '?' : '!') + '</span>';
        }
        if (item.isThinking) {
          return '<span class="thinking-dots" title="Agent is thinking"><span></span><span></span><span></span></span>';
        }
        if (includeUnread && item.unread) {
          return '<span class="unread-dot" title="Unread reply"></span>';
        }
        return '';
      }

      function renderSubagentPill(card, fallbackSpan) {
        const subList = Array.isArray(card.subagents) ? card.subagents : [];
        const subTok = Number(card.subagentTokens) || 0;
        if (subList.length > 0) {
          const isOpen = state.expandedSubagents.has(card.id);
          const label = '+' + formatTokens(subTok) + ' · ' + subList.length + ' sub ' + (isOpen ? '▴' : '▾');
          return (
            '<button type="button" class="subagent-pill' + (isOpen ? ' active' : '') + '" data-action="toggle-subagents" data-id="' + escapeHtml(card.id) + '" title="Show/hide spawned subagents">' +
              escapeHtml(label) +
            '</button>'
          );
        }
        return fallbackSpan && subTok > 0 ? '<span>(+' + escapeHtml(formatTokens(subTok)) + ' sub)</span>' : '';
      }

      function renderSubagentsList(card) {
        const subList = Array.isArray(card.subagents) ? card.subagents : [];
        if (subList.length === 0 || !state.expandedSubagents.has(card.id)) return '';
        let html = '<div class="subagents-list">';
        for (const sub of subList) {
          const subTitle = sub.title || ('Subagent ' + String(sub.id || '').slice(0, 8));
          const badge = renderStatusBadge(sub, false);
          const statusHtml = sub.waitState
            ? badge + '<span class="subagent-status-wait">' + (sub.waitState === 'question' ? 'Waiting answer' : 'Waiting permission') + '</span>'
            : (badge || '<span>Done</span>');
          html +=
            '<div class="subagent-row" data-action="open-subagent" data-id="' + escapeHtml(sub.id) + '" title="Open subagent conversation: ' + escapeHtml(subTitle) + '">' +
              '<div class="subagent-left">' +
                '<span class="muted">↳</span>' +
                '<span class="subagent-title">' + escapeHtml(subTitle) + '</span>' +
              '</div>' +
              '<div class="subagent-right">' +
                '<span class="mono">' + escapeHtml(formatTokens(Number(sub.totalTokens) || 0) + ' tok') + '</span>' +
                '<span>·</span>' +
                statusHtml +
              '</div>' +
            '</div>';
        }
        return html + '</div>';
      }

      function renderActiveCardHeader(card, effectiveScope) {
        const tier = getCardTier(card);
        statusDotEl.className = 'dot ' + tier.dot;

        const titleText = card.customTitle || card.title || card.firstPrompt || card.lastPrompt || ('Conversation ' + card.id.slice(0, 8));
        const pinIconHtml = card.pinned ? PIN_ICON_SVG : '';

        let gitStatusHtml = '';
        if (card.git && card.git.hasGit) {
          gitStatusHtml = card.git.commitsBehind > 0
            ? '<span class="drift-warn">' + card.git.commitsBehind + ' commit' + (card.git.commitsBehind === 1 ? '' : 's') + ' behind HEAD</span>'
            : '<span class="muted">HEAD in sync</span>';
        }

        const cur = formatTokens(card.currentTokens);
        const ceil = card.observedCeiling > 0 ? '~' + formatTokens(card.observedCeiling) : null;
        let fillPct = 0;
        let barColor = tier.color;
        let rightLabel = '';

        if (card.ceilingExceeded || !card.observedCeiling) {
          fillPct = card.currentTokens > 0 ? 60 : 0;
          rightLabel = card.ceilingExceeded
            ? cur + ' tok (observing new ceiling)'
            : cur + ' tok';
        } else {
          fillPct = Math.round((card.contextRatio || 0) * 100);
          if (fillPct >= 88) barColor = '#ef4444';
          else if (fillPct >= 75) barColor = '#f97316';
          rightLabel = cur + ' / ' + ceil + ' (' + fillPct + '%)';
        }

        const lastCompactLabel = card.compactCount > 0 && card.lastCompactMs
          ? 'Last compact ' + formatRelativeTime(card.lastCompactMs) + ' (' + card.promptsSinceLastCompact + ' prompt' + (card.promptsSinceLastCompact === 1 ? '' : 's') + ' ago)'
          : 'No compactions yet';

        const retentionLabel = card.compactedPrompts > 0
          ? 'Prompts: ' + card.verbatimPrompts + ' full · ' + card.compactedPrompts + ' compacted'
          : 'Prompts: all ' + card.promptCount + ' full';

        const totalTok = Number(card.totalTokens) || 0;
        const totalInTok = Number(card.totalInputTokens) || 0;
        const totalCacheTok = Number(card.totalCacheReadTokens) || 0;
        const totalOutTok = Number(card.totalOutputTokens) || 0;
        const subTok = Number(card.subagentTokens) || 0;

        const breakdownLabel =
          formatTokens(totalInTok) + ' new in · ' +
          formatTokens(totalCacheTok) + ' cached · ' +
          formatTokens(totalOutTok) + ' out';
        const exactTooltip =
          totalTok.toLocaleString('en-US') + ' total tokens (' +
          totalInTok.toLocaleString('en-US') + ' new input · ' +
          totalCacheTok.toLocaleString('en-US') + ' cache read · ' +
          totalOutTok.toLocaleString('en-US') + ' output' +
          (subTok > 0 ? ' · +' + subTok.toLocaleString('en-US') + ' subagents' : '') +
          ')';

        const isDetailsOpen = state.expandedDetails.has(card.id);
        const isHandoffOpen = state.openHandoffId === card.id;
        const cardWsKey = card.workspaceKey || '__unscoped__';
        const showPinnedUnread = Boolean(
          effectiveScope && effectiveScope !== '__all__' && effectiveScope !== cardWsKey
        );

        return (
          '<div class="conv-row-top" data-action="open-chat" data-id="' + escapeHtml(card.id) + '">' +
            '<div class="conv-title-wrap">' +
              renderStatusBadge(card, showPinnedUnread) +
              pinIconHtml +
              '<span class="conv-title">' + escapeHtml(titleText) + '</span>' +
            '</div>' +
            '<span class="muted">' + escapeHtml(formatRelativeTime(card.lastActiveMs)) + '</span>' +
          '</div>' +
          '<div class="status-row">' +
            '<div class="status-left">' +
              '<span class="tier-label ' + tier.text + '">' +
                '<span class="dot-sm ' + tier.dot + '"></span>' +
                escapeHtml(tier.label) +
              '</span>' +
              '<span class="muted">· ' + card.compactCount + ' compact' + (card.compactCount === 1 ? '' : 's') + '</span>' +
